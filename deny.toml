[graph]
all-features = true

[advisories]
# Advisory IDs to ignore. Entries here must include a reason and should be
# reviewed periodically. Remove entries once the underlying crate is updated.
ignore = [
    # rsa: Marvin Attack timing side-channel; fixed in 0.10, but these upstream
    # dependencies still require 0.9.
    { id = "RUSTSEC-2023-0071", reason = "transitive via garage-door and openidconnect; remove once both dependency paths adopt rsa >=0.10" },
    # h2 0.3.x: unbounded empty DATA frames (via actix-http; no 0.3.x patch)
    { id = "RUSTSEC-2026-0258", reason = "transitive dep via actix-http; h2 0.3.x EOL, no patch available" },
    # crypto-bigint: timing variability in constant-time ops (transitive via aws-sigv4/ecdsa)
    { id = "RUSTSEC-2026-0387", reason = "transitive dep via aws-sigv4/ecdsa; upstream crates not yet updated to >=0.7.6" },
    # zstd-safe 7.x: three advisories fixed in >=8.2.0; pinned by build-info-build via zstd 0.13.x
    { id = "RUSTSEC-2026-0391", reason = "zstd-safe 7.3.0 pinned by build-info-build; requires zstd-safe >=8.2.0" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7.3.0 pinned by build-info-build; requires zstd-safe >=8.2.0" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7.3.0 pinned by build-info-build; requires zstd-safe >=8.2.0" },
    # cookie 0.16.x is required by actix-web. The affected private-cookie
    # encryption is not enabled, including with all workspace features.
    { id = "RUSTSEC-2026-0594", reason = "via actix-web; cookie private/secure features are disabled, so private-cookie nonce generation is not compiled" },
    # Unmaintained date/time crates have no patched releases. Migration and
    # upstream dependency work is tracked in TC-7732.
    { id = "RUSTSEC-2026-0543", reason = "upstream OpenID and human-date-parser expose chrono types; CSAF/OSV, SeaORM, walker and UI dependencies also require chrono; no patched release" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz is transitive via tera; replacement requires an upstream template-engine change; no patched release" },
    { id = "RUSTSEC-2026-0559", reason = "chrono-tz-build is a build dependency of chrono-tz via tera; no patched release" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "PostgreSQL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

exceptions = [
    # sequoia-openpgp and its dependency; LGPL with Rust static-linking
    # exception is effectively permissive for our use case
    { allow = ["LGPL-2.0-or-later"], crate = "buffered-reader" },
    { allow = ["LGPL-2.0-or-later"], crate = "sequoia-openpgp" },
    # r-efi is dual-licensed Apache-2.0 OR LGPL-2.1-or-later; cargo-deny
    # sees both arms so we must explicitly allow the LGPL arm
    { allow = ["LGPL-2.1-or-later"], crate = "r-efi" },
    # trustify-ui is Apache-2.0 but its generated crate manifest omits the
    # license field; tracked upstream at guacsec/trustify-ui
    { allow = ["Apache-2.0"], crate = "trustify-ui" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/ctron/spdx-rs",
    # v0.3.0 Lightwell backport until an upstream release can be adopted
    "https://github.com/dejanb/osv",
    "https://github.com/guacsec/trustify-ui.git",
]

[sources.allow-org]
github = []
