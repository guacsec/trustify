[graph]
all-features = true
# If we ever end up building for other platforms, this list must be updated
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
# Advisory IDs to ignore. Entries here must include a reason and should be
# reviewed periodically. Remove entries once the underlying crate is updated.
ignore = [
    # rsa: Marvin Attack timing side-channel (transitive via sequoia-openpgp)
    { id = "RUSTSEC-2023-0071", reason = "transitive dep via sequoia-openpgp; no fix available" },
    # h2 0.3.x: unbounded empty DATA frames (via actix-http; no 0.3.x patch)
    { id = "RUSTSEC-2026-0258", reason = "transitive dep via actix-http; h2 0.3.x EOL, no patch available" },
    # cookie 0.16.x is required by actix-web. The affected private-cookie
    # encryption is not enabled, including with all workspace features.
    { id = "RUSTSEC-2026-0594", reason = "via actix-web; cookie private/secure features are disabled, so private-cookie nonce generation is not compiled" },
    # Unmaintained date/time crates have no patched releases. Keep these
    # exceptions specific to maintenance advisories while replacements are assessed.
    { id = "RUSTSEC-2026-0543", reason = "upstream OpenID and human-date-parser expose chrono types; CSAF/OSV, SeaORM, walker and UI dependencies also require chrono; no patched release" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz is transitive via tera; replacement requires an upstream template-engine change; no patched release" },
    { id = "RUSTSEC-2026-0559", reason = "chrono-tz-build is a build dependency of chrono-tz via tera; no patched release" },
    { id = "RUSTSEC-2026-0542", reason = "local duration handling uses Jiff; upstream csaf-walker, sbom-walker and walker-common still require humantime; no patched release" },
    # Unmaintained, transitive via the yew stack of the correlation UI (wasm, not shipped
    # with the server)
    # bincode 1.3.3: via gloo-worker
    { id = "RUSTSEC-2025-0141", reason = "correlation UI only, via gloo-worker; considered complete by its authors" },
    # paste: via monaco
    { id = "RUSTSEC-2024-0436", reason = "correlation UI only, via monaco; no direct replacement yet" },
    # proc-macro-error: via yew-macro
    { id = "RUSTSEC-2024-0370", reason = "correlation UI only, via yew-macro; no direct replacement yet" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "PostgreSQL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

exceptions = [
    # sequoia-openpgp and its dependency; LGPL with Rust static-linking
    # exception is effectively permissive for our use case
    { allow = ["LGPL-2.0-or-later"], crate = "buffered-reader" },
    { allow = ["LGPL-2.0-or-later"], crate = "sequoia-openpgp" },
    # r-efi is dual-licensed Apache-2.0 OR LGPL-2.1-or-later; cargo-deny
    # sees both arms so we must explicitly allow the LGPL arm
    { allow = ["LGPL-2.1-or-later"], crate = "r-efi" },
    # trustify-ui is Apache-2.0 but its generated crate manifest omits the
    # license field; tracked upstream at guacsec/trustify-ui
    { allow = ["Apache-2.0"], crate = "trustify-ui" },
    # progenitor-client is MPL-2.0 (file-level copyleft, used unmodified);
    # pulled in by trustify-client for the correlation UI
    { allow = ["MPL-2.0"], crate = "progenitor-client" },
]

[[licenses.clarify]]
crate = "trustify-ui"
expression = "Apache-2.0"
license-files = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/ctron/spdx-rs",
    # v0.3.0 Lightwell backport until an upstream release can be adopted
    "https://github.com/dejanb/osv",
    "https://github.com/guacsec/trustify-ui.git",
    # trustify-client with derived PartialEq, for the correlation UI, until
    # https://github.com/rh-jfuller/trustify-clients/pull/10 is released
    "https://github.com/ctron/trustify-clients.git",
]

[sources.allow-org]
github = []
