[graph]
all-features = true

[advisories]
# Advisory IDs to ignore. Entries here must include a reason and should be
# reviewed periodically. Remove entries once the underlying crate is updated.
ignore = [
    # rsa: Marvin Attack timing side-channel (transitive via sequoia-openpgp)
    { id = "RUSTSEC-2023-0071", reason = "transitive dep via sequoia-openpgp; no fix available" },
    # h2 0.3.x: unbounded empty DATA frames (via actix-http; no 0.3.x patch)
    { id = "RUSTSEC-2026-0258", reason = "transitive dep via actix-http; h2 0.3.x EOL, no patch available" },
    # zip: extraction vulnerabilities fixed in 9.x; utoipa-swagger-ui 10.0.1 requires 8.6.
    { id = "RUSTSEC-2026-0367", reason = "zip 8.x; upgrade workspace dependency and utoipa-swagger-ui to use zip >=9" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8.x; upgrade workspace dependency and utoipa-swagger-ui to use zip >=9" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8.x; upgrade workspace dependency and utoipa-swagger-ui to use zip >=9" },
    # crypto-bigint: timing variability in constant-time ops (transitive via aws-sigv4/ecdsa)
    { id = "RUSTSEC-2026-0387", reason = "transitive dep via aws-sigv4/ecdsa; upstream crates not yet updated to >=0.7.6" },
    # zstd-safe 7.x: three advisories fixed in >=8.2.0; pinned by build-info-build via zstd 0.13.x
    { id = "RUSTSEC-2026-0391", reason = "zstd-safe 7.3.0 pinned by build-info-build; requires zstd-safe >=8.2.0" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7.3.0 pinned by build-info-build; requires zstd-safe >=8.2.0" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7.3.0 pinned by build-info-build; requires zstd-safe >=8.2.0" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "PostgreSQL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

exceptions = [
    # sequoia-openpgp and its dependency; LGPL with Rust static-linking
    # exception is effectively permissive for our use case
    { allow = ["LGPL-2.0-or-later"], crate = "buffered-reader" },
    { allow = ["LGPL-2.0-or-later"], crate = "sequoia-openpgp" },
    # r-efi is dual-licensed Apache-2.0 OR LGPL-2.1-or-later; cargo-deny
    # sees both arms so we must explicitly allow the LGPL arm
    { allow = ["LGPL-2.1-or-later"], crate = "r-efi" },
    # trustify-ui is Apache-2.0 but its generated crate manifest omits the
    # license field; tracked upstream at guacsec/trustify-ui
    { allow = ["Apache-2.0"], crate = "trustify-ui" },
]

[[licenses.clarify]]
crate = "trustify-ui"
expression = "Apache-2.0"
license-files = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/ctron/spdx-rs",
    "https://github.com/guacsec/trustify-ui.git",
]

[sources.allow-org]
github = []
