# Semantic validators configuration (ADR 00021).
#
# Point the server at this file to enable ingestion-time validation:
#
#   trustd api --validators-config etc/validators/validators.yaml
#   # or
#   TRUSTD_VALIDATORS_CONFIG=etc/validators/validators.yaml trustd api
#
# `rules` paths are resolved relative to the process working directory
# (use absolute paths in production). When no validators are configured,
# validation is disabled and ingestion behaves as before.

# Store validation results in the `validation_report` table. Set to false to
# fall back to logging them at debug level, leaving the table untouched.
persist_reports: true

# Bounds on how much of a report is stored. Findings beyond either limit are
# dropped and the report is flagged as truncated.
caps:
  max_findings: 200
  max_findings_bytes: 65536

validators:
  # CSAF advisories: official spec validation via csaf-rs.
  # Profiles: basic (schema + mandatory), extended (+ recommended),
  # full (+ informative). CSAF 2.1 also supports: mandatory,
  # recommended, informative, schema, external-request-free,
  # consistent-revision-history, consistent-date-times, ssvc.
  - name: csaf-spec
    backend:
      type: csaf
      profile: basic
    formats: [csaf]
    mode: report
    threshold: error
    on_error: continue
    # Defaults, shown here once: store every result, and never reuse a stored
    # verdict for a document we have seen before.
    persist: true
    revalidate: always

  # CSAF advisories: additional scheck-based structural checks.
  - name: csaf-mandatory
    backend:
      type: scheck
      rules:
        - etc/validators/rules/csaf-mandatory.json
      phase: structural
    formats: [csaf]
    mode: report
    threshold: error
    on_error: continue

  # SPDX SBOMs: gate ingestion. Any finding at or above `threshold`
  # (error) rejects the document; if the validator itself errors,
  # `on_error: block` treats that as a failed gate.
  - name: spdx-min
    backend:
      type: scheck
      rules:
        - etc/validators/rules/spdx-min.json
    formats: [spdx]
    mode: verify
    threshold: error
    on_error: block

  # CycloneDX SBOMs: report-only.
  - name: cyclonedx-min
    backend:
      type: scheck
      rules:
        - etc/validators/rules/cyclonedx-min.json
    formats: [cyclonedx]
    mode: report
    threshold: error
    on_error: continue
