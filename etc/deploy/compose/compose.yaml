services:
  postgres:
    image: docker.io/library/postgres:19
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: "trustify"
      POSTGRES_DB: "trustify"
    restart: always
    shm_size: '1g'
    command: >
      postgres -c random_page_cost=1.1 -c max_parallel_workers_per_gather=4 -c shared_preload_libraries='pg_stat_statements' -c shared_buffers=2GB -c max_wal_size=16GB -c checkpoint_timeout=15min
#    volumes:
#      - <base>/dump.sql.gz:/docker-entrypoint-initdb.d/dump.sql.gz:Z
