name: perf-test-dispatch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  dispatch:
    if: github.event.comment.body == '/perf-test' && github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - name: Check commenter permission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENTER: ${{ github.event.comment.user.login }}
          REPOSITORY: ${{ github.repository }}
        run: |
          permission=$(gh api "repos/$REPOSITORY/collaborators/$COMMENTER/permission" --jq '.permission')
          echo "Commenter permission: $permission"
          case "$permission" in
            admin|write|maintain) ;;
            *) echo "Only repository collaborators with write access can start a perf test."; exit 1 ;;
          esac

      - name: Read pull request head
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          pr=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")
          {
            echo "repository=$(jq -r '.head.repo.full_name' <<< "$pr")"
            echo "sha=$(jq -r '.head.sha' <<< "$pr")"
            echo "ref=$(jq -r '.head.ref' <<< "$pr")"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch perf test to scale-test-runs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          SOURCE_REPOSITORY: ${{ steps.pr.outputs.repository }}
          SOURCE_SHA: ${{ steps.pr.outputs.sha }}
          SOURCE_REF: ${{ steps.pr.outputs.ref }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          jq -n \
            --arg ref main \
            --arg mode pr \
            --arg source_repository "$SOURCE_REPOSITORY" \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_ref "$SOURCE_REF" \
            --arg pr_number "$PR_NUMBER" \
            '{ref: $ref, inputs: {mode: $mode, source_repository: $source_repository, source_sha: $source_sha, source_ref: $source_ref, pr_number: $pr_number}}' \
            | gh api --method POST \
                repos/guacsec/trustify-scale-test-runs/actions/workflows/trustify-perf.yaml/dispatches \
                --input -

      - name: Acknowledge command
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          if ! gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            -f body="🛠️ Perf test queued in [trustify-scale-test-runs](https://github.com/guacsec/trustify-scale-test-runs/actions/workflows/trustify-perf.yaml). The report will appear on the [PR perf dashboard](https://guacsec.github.io/trustify-scale-test-runs/perf/pr/)."; then
            echo "::warning::Perf test was dispatched, but GitHub refused the PR acknowledgement comment."
          fi
