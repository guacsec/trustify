name: prepare-release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        default: patch
        options:
          - alpha
          - beta
          - rc
          - patch
          - minor
      version-override:
        description: "Full version override (e.g., 0.6.0-alpha.1). Takes precedence over bump type."
        required: false
        type: string
        default: ""

concurrency:
  group: prepare-release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.repository_owner == 'guacsec'
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit
    uses: guacsec/trustify-release-tools/.github/workflows/prepare-release.yaml@main
    with:
      bump: ${{ inputs.bump }}
      version-override: ${{ inputs.version-override }}

  notify_channel:
    needs: prepare
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions: {}
    env:
      USERNAME: "@trustification-bot:matrix.org"
      PASSWORD: ${{ secrets.MATRIX_BOT_PASSWORD }}
      ROOM: "#trustification:matrix.org"
    steps:
      - name: Notify Matrix of prepared release
        if: env.PASSWORD
        env:
          PR_URL: ${{ needs.prepare.outputs.pr-url }}
        run: |
          test -n "$PR_URL"
          podman run --rm docker.io/matrixcommander/matrix-commander:latest --login password --homeserver https://matrix.org --device github --user-login "$USERNAME" --password "$PASSWORD" --room-default "$ROOM" --message "Release prepared; PR awaits approval: $PR_URL" --logout me
