name: docs

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

concurrency: docs

jobs:

  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: |
          cd docs/book
          npm ci
          make all
