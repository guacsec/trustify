name: ci

on:
  push:
    branches:
      - main
      - release/**
  merge_group:
    types:
      - checks_requested
  pull_request:
    branches:
      - main
      - release/**
      - feature/**

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:

  supply-chain:
    name: Supply chain audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        id: audit
        # Dependency findings must not block PRs or the merge queue.
        continue-on-error: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        with:
          command: check
      - name: Report audit failure
        if: steps.audit.outcome == 'failure'
        run: echo "::warning::Supply chain audit failed; see the audit step for details. Release builds require a passing audit."

  check:
    name: Check
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - ubuntu-24.04
          - macos-15
        include:
          - os: windows-2025
            install: |
              git config --system core.longpaths true
              echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
              vcpkg install openssl:x64-windows-static-md

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Cache Theseus Postgresql Installation
        uses: actions/cache@v6
        with:
          path: ~/.theseus/postgresql
          key: ${{ runner.os }}-theseus-postgresql-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        if: matrix.install != ''
        run: ${{ matrix.install }}

      - uses: ./.github/actions/setup-console

      - name: Clippy
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" # for embedded postgresql
        run: cargo clippy --all-targets --all-features -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::todo -D clippy::unimplemented

  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/maximize-build-space

      - name: Ensure PostgreSQL timezone data
        run: |
          # The embedded PostgreSQL binary reads timezone data from the host.
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --reinstall tzdata

      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            non_md_changes:
              - '!**/*.md'

      - name: Cache Theseus Postgresql Installation
        uses: actions/cache@v6
        with:
          path: ~/.theseus/postgresql
          key: ${{ runner.os }}-theseus-postgresql-${{ hashFiles('**/Cargo.lock') }}

      - name: Format
        run: cargo fmt --check

      - name: Start S3 mock
        run: |
          docker compose -f etc/deploy/compose/compose-s3mock.yaml up -d --wait

      - name: Create tmp dir
        run: |
          sudo mkdir /mnt/trustify
          sudo chmod a+rwx /mnt/trustify

      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-nextest

      - uses: ./.github/actions/setup-console

      - name: Test
        if: steps.filter.outputs.non_md_changes == 'true'
        run: cargo nextest run --all-features -E 'not test(=m0002010::performance)' --profile ci
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" # for embedded postgresql
          RUST_LOG: info,sqlx=error,sea_orm=error
          TRUSTIFY_S3_AWS_REGION: eu-west-1
          TRUSTIFY_S3_AWS_BUCKET: guacsec-migration-dumps
          TMPDIR: /mnt/trustify

      - name: UI feature combinations
        if: steps.filter.outputs.non_md_changes == 'true'
        run: |
          cargo test -p trustify-server --lib --no-default-features ui::test::
          cargo test -p trustify-server --lib --no-default-features --features trustify-ui ui::test::
          cargo test -p trustify-server --lib --no-default-features --features ui-console ui::test::
          cargo test -p trustify-server --lib --no-default-features --features trustify-ui,ui-console ui::test::
          cargo test -p trustify-module-ui --no-default-features
          node --test ui/scripts/install-dependencies.test.mjs

      - name: Doc tests
        if: steps.filter.outputs.non_md_changes == 'true'
        run: cargo test --doc --all-features

      - name: Export and Validate Generated Openapi Spec
        run: |
          cargo xtask openapi
          if ! git diff --quiet; then
              echo "::error::Uncommitted changes (run 'cargo xtask openapi' after making api changes)"
              exit 1
          fi
      - name: Ensure schemas are up-to-date
        run: |
          cargo xtask generate-schemas
          if ! git diff --quiet; then
              echo "::error::Uncommitted changes (run 'cargo xtask generate-schemas' after making changes to the models)"
              exit 1
          fi
      - name: Check the docs
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the docs
        run: |
          cd docs/book
          npm ci
          make all

  ui-e2e:
    name: UI end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/maximize-build-space
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ui-e2e
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-compose xz-utils libssl-dev pkg-config
          rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: trunk@0.22.1
      - name: Cache Trunk tools
        uses: actions/cache@v6
        with:
          path: ~/.cache/trunk
          key: ui-e2e-trunk-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'ui/package-lock.json') }}
      - name: Install UI and browser dependencies
        working-directory: ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check test types
        working-directory: ui
        run: npm run typecheck
      - name: Start Podman API for Compose providers
        run: |
          nohup podman system service --time=0 "unix://${RUNNER_TEMP}/trustify-podman.sock" > "${RUNNER_TEMP}/trustify-podman.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/trustify-podman.pid"
          echo "DOCKER_HOST=unix://${RUNNER_TEMP}/trustify-podman.sock" >> "$GITHUB_ENV"
          for attempt in {1..60}; do
            if test -S "${RUNNER_TEMP}/trustify-podman.sock"; then exit 0; fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/trustify-podman.log"
          exit 1
      - name: Run UI tests
        working-directory: ui
        run: npm run test:e2e
      - name: Stop Podman API
        if: always()
        run: |
          if test -f "${RUNNER_TEMP}/trustify-podman.pid"; then
            kill "$(cat "${RUNNER_TEMP}/trustify-podman.pid")" || true
          fi
      - name: Upload UI reports and service logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-e2e-results
          path: |
            ui/e2e-results/
            ${{ runner.temp }}/trustify-podman.log
          retention-days: 14
          if-no-files-found: warn

  ci:
    runs-on: ubuntu-slim
    needs:
      - supply-chain
      - check
      - test
      - ui-e2e
    if: always()
    steps:
      - name: Success
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.ui-e2e.result == 'success' }}
        run: exit 0
      - name: Failure
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.ui-e2e.result != 'success' }}
        run: exit 1

  container:
    needs:
      - check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/maximize-build-space
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: container

      - uses: ./.github/actions/setup-console

      - name: Build binaries
        run: cargo build --bin trustd --bin xtask --no-default-features --features trustify-trustd/trustify-ui,trustify-trustd/ui-console --release

      - name: Stage binaries for container build
        run: |
          VERSION=ci
          TARGET=x86_64-unknown-linux-gnu

          for bin in trustd xtask; do
            DIR="${bin}-${VERSION}-${TARGET}"
            mkdir -p "download/${bin}-${TARGET}"
            mkdir -p "pack/${DIR}"
            cp "target/release/${bin}" "pack/${DIR}/${bin}"
            cp LICENSE "pack/${DIR}/"
            tar -C pack -czvf "download/${bin}-${TARGET}/${DIR}.tar.gz" "${DIR}"
          done

      - name: Build and smoke test containers
        uses: ./.github/actions/build-container
        with:
          image_tag: ci
          platforms: linux/amd64
          build_gensbom: 'false'

      - name: Scan trustd container for vulnerabilities
        uses: anchore/scan-action@v7
        id: scan-trustd
        with:
          image: docker-archive:trustd.tar
          fail-build: false
          severity-cutoff: high
          output-format: sarif
          output-file: trustd-grype.sarif

      - name: Print trustd vulnerabilities
        if: always() && steps.scan-trustd.outcome == 'success'
        run: |
          jq -r '
            .runs[].results[] |
            "\(.level // "warning") \(.locations[0].physicalLocation.artifactLocation.uri // "unknown")  \(.message.text)"
          ' trustd-grype.sarif | sort | head -100

      - name: Scan xtask container for vulnerabilities
        uses: anchore/scan-action@v7
        id: scan-xtask
        with:
          image: docker-archive:xtask.tar
          fail-build: false
          severity-cutoff: high
          output-format: sarif
          output-file: xtask-grype.sarif

      - name: Print xtask vulnerabilities
        if: always() && steps.scan-xtask.outcome == 'success'
        run: |
          jq -r '
            .runs[].results[] |
            "\(.level // "warning") \(.locations[0].physicalLocation.artifactLocation.uri // "unknown")  \(.message.text)"
          ' xtask-grype.sarif | sort | head -100

      - name: Upload trustd scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trustd-grype.sarif
          category: grype-trustd

      - name: Upload xtask scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: xtask-grype.sarif
          category: grype-xtask
