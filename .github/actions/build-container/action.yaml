name: Build container
description: Build containers for trustify

inputs:
  image_tag:
    description: The tag of the container image
    required: true
  platforms:
    description: Target platforms for the container build
    required: false
    default: 'linux/amd64, linux/arm64'
  build_gensbom:
    description: Whether to build the gensbom container
    required: false
    default: 'true'

runs:
  using: "composite"

  steps:
    # The containerd store retains all platforms when loading, saving, and pushing images.
    - name: Set up Docker
      uses: docker/setup-docker-action@v5
      with:
        daemon-config: |
          {
            "features": {
              "containerd-snapshotter": true
            }
          }

    - name: Set up QEMU
      if: contains(inputs.platforms, 'arm64')
      uses: docker/setup-qemu-action@v4
      with:
        platforms: arm64

    - name: Build Image (trustd)
      id: build-image-trustd
      uses: docker/build-push-action@v7
      with:
        tags: trustd:${{ inputs.image_tag }}
        load: true
        build-args: |
          tag=${{ inputs.image_tag }}
        platforms: ${{ inputs.platforms }}
        context: .
        file: .github/scripts/Containerfile

    - name: Build Image (xtask)
      id: build-image-xtask
      uses: docker/build-push-action@v7
      with:
        tags: xtask:${{ inputs.image_tag }}
        load: true
        build-args: |
          tag=${{ inputs.image_tag }}
        platforms: ${{ inputs.platforms }}
        context: .
        file: .github/scripts/Containerfile.xtask

    - name: Build Image (gensbom)
      if: inputs.build_gensbom == 'true'
      id: build-image-gensbom
      uses: docker/build-push-action@v7
      with:
        tags: gensbom:${{ inputs.image_tag }}
        load: true
        build-args: |
          tag=${{ inputs.image_tag }}
        platforms: ${{ inputs.platforms }}
        file: etc/gensbom/Containerfile
        context: ./etc/gensbom

    - name: Check images created
      shell: bash
      run: docker image ls

    - name: Smoke test container (trustd)
      shell: bash
      run: docker run --rm trustd:${{ inputs.image_tag }} --help

    - name: Smoke test container (xtask)
      shell: bash
      run: docker run --rm xtask:${{ inputs.image_tag }} --help

    # Keep Docker archives for downloads and the CI vulnerability scans.
    - name: Save image (trustd)
      shell: bash
      run: docker image save trustd:${{ inputs.image_tag }} > trustd.tar

    - name: Save image (xtask)
      shell: bash
      run: docker image save xtask:${{ inputs.image_tag }} > xtask.tar

    - name: Save image (gensbom)
      if: inputs.build_gensbom == 'true'
      shell: bash
      run: docker image save gensbom:${{ inputs.image_tag }} > gensbom.tar

    - uses: actions/upload-artifact@v7
      with:
        name: container-trustd
        path: trustd.tar
        if-no-files-found: error

    - uses: actions/upload-artifact@v7
      with:
        name: container-xtask
        path: xtask.tar
        if-no-files-found: error

    - uses: actions/upload-artifact@v7
      if: inputs.build_gensbom == 'true'
      with:
        name: container-gensbom
        path: gensbom.tar
        if-no-files-found: error
