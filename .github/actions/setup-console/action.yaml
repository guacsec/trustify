name: Setup console build
description: Install the toolchain for the embedded Wasm console
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: ui/package-lock.json
    - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2
      with:
        tool: trunk@0.22.1
    - name: Install Wasm target
      shell: bash
      run: rustup target add wasm32-unknown-unknown
