[package]
name = "trustify-correlation-ui"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[dependencies]
trustify-module-correlation = { path = "../.." }
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = [
    "File",
    "FileList",
    "FileReader",
    "DragEvent",
    "DataTransfer",
    "HtmlInputElement",
    "HtmlTextAreaElement",
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
lzma-rs = "0.3"
