[build]
target = "index.html"

[watch]
watch = ["src", "index.html", "assets", "Cargo.toml", "../Cargo.lock", "package.json", "package-lock.json", "scripts"]

[[hooks]]
stage = "pre_build"
command = "node"
command_arguments = ["scripts/install-dependencies.mjs"]

[[proxy]]
rewrite = "/api/"
backend = "http://localhost:8080/api/"

[[proxy]]
rewrite = "/.well-known/"
backend = "http://localhost:8080/.well-known/"

[[proxy]]
rewrite = "/realms/"
backend = "http://localhost:8090/realms/"

[[proxy]]
rewrite = "/swagger-ui/"
backend = "http://localhost:8080/swagger-ui/"

[[proxy]]
rewrite = "/openapi.json"
backend = "http://localhost:8080/openapi.json"
