      type: object
      description: |-
        Request to partially update SBOM group assignments (add and/or remove).

        Applies cartesian product semantics: each SBOM in `sbom_ids` gets all `add` groups
        added and all `remove` groups removed, while preserving other existing assignments.
      required:
      - sbom_ids
      properties:
        add:
          type: array
          items:
            type: string
          description: Group IDs to add to each SBOM's assignments.
        remove:
          type: array
          items:
            type: string
          description: Group IDs to remove from each SBOM's assignments.
        sbom_ids:
          type: array
          items:
            type: string
          description: The IDs of the SBOMs to update.
