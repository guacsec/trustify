components:
  schemas:
    AdvisoryDetails:
      allOf:
      - $ref: '#/components/schemas/AdvisoryHead'
      - $ref: '#/components/schemas/SourceDocument'
      - type: object
        required:
        - vulnerabilities
        properties:
          vulnerabilities:
            type: array
            items:
              $ref: '#/components/schemas/AdvisoryVulnerabilitySummary'
            description: Vulnerabilities addressed within this advisory.
    AdvisoryHead:
      type: object
      required:
      - uuid
      - identifier
      - document_id
      - issuer
      - published
      - withdrawn
      - title
      - labels
      properties:
        document_id:
          type: string
          description: The identifier of the advisory, as provided by the document.
        identifier:
          type: string
          description: The identifier of the advisory, as assigned by the issuing organization.
        issuer:
          oneOf:
          - $ref: '#/components/schemas/OrganizationSummary'
            description: |-
              The issuer of the advisory, if known. If no issuer is able to be
              determined, this field will not be included in a response.
          - type: 'null'
        labels:
          $ref: '#/components/schemas/Labels'
          description: Informational labels attached by the system or users to this advisory.
        modified:
          type:
          - string
          - 'null'
          format: date-time
          description: The date (in RFC3339 format) of when the advisory was last modified, if any.
        published:
          type:
          - string
          - 'null'
          format: date-time
          description: The date (in RFC3339 format) of when the advisory was published, if any.
        title:
          type:
          - string
          - 'null'
          description: The title of the advisory as assigned by the issuing organization.
        uuid:
          type: string
          description: The opaque UUID of the advisory.
        withdrawn:
          type:
          - string
          - 'null'
          format: date-time
          description: The date (in RFC3339 format) of when the advisory was withdrawn, if any.
    AdvisorySummary:
      allOf:
      - $ref: '#/components/schemas/AdvisoryHead'
      - $ref: '#/components/schemas/SourceDocument'
        description: Information pertaning to the underlying source document, if any.
      - type: object
        required:
        - vulnerabilities
        properties:
          vulnerabilities:
            type: array
            items:
              $ref: '#/components/schemas/AdvisoryVulnerabilityHead'
            description: Vulnerabilities addressed within this advisory.
    AdvisoryVulnerabilityHead:
      allOf:
      - $ref: '#/components/schemas/VulnerabilityHead'
      - type: object
        required:
        - scores
        properties:
          scores:
            type: array
            items:
              $ref: '#/components/schemas/ScoredVector'
            description: All CVSS scores with their raw vector strings from the advisory for this vulnerability.
    AdvisoryVulnerabilitySummary:
      allOf:
      - $ref: '#/components/schemas/AdvisoryVulnerabilityHead'
      description: Summary of information from this advisory regarding a single specific vulnerability.
    AlgorithmPolicyResult:
      type: object
      required:
      - sbom_id
      - node_id
      - name
      - oid
      - properties
      - verdict
      properties:
        name:
          type: string
        node_id:
          type: string
        oid:
          type:
          - string
          - 'null'
        properties:
          type: object
        sbom_id:
          type: string
          format: uuid
        verdict:
          $ref: '#/components/schemas/PolicyVerdict'
    AnalysisAdvisory:
      allOf:
      - $ref: '#/components/schemas/AdvisoryHead'
      - type: object
        required:
        - scores
        properties:
          scores:
            type: array
            items:
              $ref: '#/components/schemas/Score'
            description: CVSS scores
    AnalysisDetails:
      allOf:
      - $ref: '#/components/schemas/VulnerabilityHead'
      - type: object
        required:
        - status
        properties:
          status:
            type: object
            description: List of purl statuses
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/AnalysisAdvisory'
            propertyNames:
              type: string
    AnalysisDetailsV3:
      allOf:
      - $ref: '#/components/schemas/VulnerabilityHead'
      - type: object
        required:
        - purl_statuses
        properties:
          purl_statuses:
            type: array
            items:
              $ref: '#/components/schemas/AnalysisPurlStatus'
            description: List of purl statuses & remediations
    AnalysisPurlStatus:
      allOf:
      - $ref: '#/components/schemas/PurlStatus'
      - type: object
        required:
        - remediations
        properties:
          remediations:
            type: array
            items:
              $ref: '#/components/schemas/RemediationSummary'
    AnalysisRequest:
      type: object
      required:
      - purls
      properties:
        include_resolved:
          type: boolean
          description: |-
            When true, include resolved statuses (fixed, not_affected)
            alongside affected.
        purls:
          type: array
          items:
            type: string
    AnalysisResponse:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/AnalysisResult'
      propertyNames:
        type: string
    AnalysisResponseV3:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/AnalysisResultV3'
      propertyNames:
        type: string
    AnalysisResult:
      type: object
      required:
      - details
      - warnings
      properties:
        details:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisDetails'
        warnings:
          type: array
          items:
            type: string
    AnalysisResultV3:
      type: object
      required:
      - details
      - warnings
      properties:
        details:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisDetailsV3'
        warnings:
          type: array
          items:
            type: string
    AnalysisStatus:
      type: object
      required:
      - sbom_count
      - graph_count
      - graph_memory
      - graph_max_memory
      - loading_operations
      properties:
        details:
          oneOf:
          - $ref: '#/components/schemas/AnalysisStatusDetails'
            description: More details
          - type: 'null'
        graph_count:
          type: integer
          format: int32
          description: The number of graphs loaded in memory
          minimum: 0
        graph_max_memory:
          type: integer
          format: int64
          description: The maximum number of bytes the cache will hold
          minimum: 0
        graph_memory:
          type: integer
          format: int64
          description: The number of bytes consumed by entries in the graph
          minimum: 0
        loading_operations:
          type: integer
          format: int32
          description: The number of ongoing loading operations
          minimum: 0
        sbom_count:
          type: integer
          format: int32
          description: The number of SBOMs found in the database
          minimum: 0
    AnalysisStatusDetails:
      type: object
      required:
      - cache
      properties:
        cache:
          $ref: '#/components/schemas/CacheStatusDetails'
          description: Details about the cache
    AnalyzeRequest:
      type: object
      description: Request body for triggering an Exploit Intelligence analysis.
      required:
      - sbom_id
      - vulnerability_id
      properties:
        sbom_id:
          type: string
          format: uuid
          description: The SBOM identifier to analyze.
        vulnerability_id:
          type: string
          description: The vulnerability identifier (e.g., "CVE-2024-9680").
    AnalyzeResponse:
      type: object
      description: Response returned when an analysis job is successfully created.
      required:
      - job_id
      - status
      properties:
        job_id:
          type: string
          format: uuid
          description: The unique job identifier.
        status:
          $ref: '#/components/schemas/ExploitIntelligenceJobStatus'
          description: Current lifecycle status of the job.
    AssertionOrigin:
      type: string
      description: How the matching status was obtained from an advisory.
      enum:
      - unknown
      - stated
      - default
      - inferred
      - publisher_policy
    AssertionStatus:
      type: string
      description: Status assertion from an advisory.
      enum:
      - affected
      - fixed
      - not_affected
      - under_investigation
      - recommended
    AuthConfig:
      type: object
      description: |-
        Authentication configuration for HTTP-based importers.

        Wraps an [`AuthMethod`] whose credentials are resolved from
        a [`CredentialSource`] at import time — not at configuration time.
      required:
      - method
      properties:
        method:
          $ref: '#/components/schemas/AuthMethod'
    AuthMethod:
      oneOf:
      - type: object
        description: HTTP Basic authentication.
        required:
        - username
        - password
        - type
        properties:
          password:
            $ref: '#/components/schemas/CredentialSource'
          type:
            type: string
            enum:
            - basic
          username:
            $ref: '#/components/schemas/CredentialSource'
      - type: object
        description: Bearer token in the Authorization header.
        required:
        - token
        - type
        properties:
          token:
            $ref: '#/components/schemas/CredentialSource'
          type:
            type: string
            enum:
            - bearer
      - type: object
        description: Arbitrary header/value pair (e.g. API key headers).
        required:
        - header
        - value
        - type
        properties:
          header:
            type: string
          type:
            type: string
            enum:
            - apiKey
          value:
            $ref: '#/components/schemas/CredentialSource'
      description: HTTP authentication method applied on each import request.
    BasePurlDetails:
      allOf:
      - $ref: '#/components/schemas/BasePurlHead'
      - type: object
        required:
        - versions
        properties:
          versions:
            type: array
            items:
              $ref: '#/components/schemas/VersionedPurlSummary'
    BasePurlHead:
      type: object
      required:
      - uuid
      - purl
      properties:
        purl:
          $ref: '#/components/schemas/Purl'
          description: The actual base PURL
        uuid:
          type: string
          format: uuid
          description: The ID of the base PURL
    BasePurlSummary:
      allOf:
      - $ref: '#/components/schemas/BasePurlHead'
    BaseScore:
      type: object
      description: |-
        Base score information in the context of a [`VulnerabilityHead`]. Notably, this excludes the
        raw CVSS vector string.

        Uses the same `ScoreType` and `Severity` serialization as [`crate::common::model::Score`]
        so that all score-related fields in API responses are consistent.
      required:
      - type
      - severity
      - score
      properties:
        score:
          type: number
          format: double
        severity:
          $ref: '#/components/schemas/Severity'
        type:
          $ref: '#/components/schemas/ScoreType'
    BaseSummary:
      type: object
      required:
      - sbom_id
      - node_id
      - purl
      - cpe
      - name
