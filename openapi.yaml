        sbom_id:
          type: string
          format: uuid
        sboms_count:
          type: integer
          format: int64
    CryptoAssetType:
      type: string
      description: |-
        Possible types of the cryptographic assets within a CBOM
        https://cyclonedx.org/docs/1.6/json/#components_items_cryptoProperties_assetType
      enum:
      - algorithm
      - certificate
      - protocol
      - related-crypto-material
    CryptoSummary:
      type: object
      description: Aggregate KPI metrics for cryptographic assets across all SBOMs.
      required:
      - total_algorithms
      - pqc_compliant
      - classical_share_pct
      - sboms_meeting_pqc
      properties:
        classical_share_pct:
          type: number
          format: double
        pqc_compliant:
          type: integer
          format: int64
        sboms_meeting_pqc:
          type: integer
          format: int64
        total_algorithms:
          type: integer
          format: int64
    CsafImporter:
      allOf:
      - $ref: '#/components/schemas/CommonImporter'
      - type: object
        required:
        - source
        properties:
          fetchRetries:
            type:
            - integer
            - 'null'
            minimum: 0
          ignoreMissing:
            type: boolean
          onlyPatterns:
            type: array
            items:
              type: string
          source:
            type: string
          v3Signatures:
            type: boolean
    CveImporter:
      allOf:
      - $ref: '#/components/schemas/CommonImporter'
      - type: object
        properties:
          source:
            type: string
          startYear:
            type:
            - integer
            - 'null'
            format: int32
            minimum: 0
          years:
            type: array
            items:
              type: integer
              format: int32
              minimum: 0
            uniqueItems: true
    CweImporter:
      allOf:
      - $ref: '#/components/schemas/CommonImporter'
      - type: object
        properties:
          source:
            type: string
    EnabledBy:
      type: object
      description: The correlation option which enabled a match, as it was when the evidence was extracted.
      required:
      - option_id
      - key
      - publisher_namespace
      properties:
        key:
          $ref: '#/components/schemas/CorrelationOptionKey'
        option_id:
          type: string
          format: uuid
        publisher_namespace:
          type: string
        reason:
          type:
          - string
          - 'null'
    ErrorInformation:
      type: object
      required:
      - error
      properties:
        details:
          type:
          - string
          - 'null'
          description: Human-readable error details
        error:
          type: string
          description: A machine-readable error type
        message:
          type: string
          description: A human-readable error message
    EvidenceContext:
      type: object
      description: |-
        A product (assertion context) a piece of evidence was matched in, and how the SBOM component
        got into it.
      required:
      - context_id
      - name
      - source
      - distance
      - node_identifier
      - context_identifier
      - confidence
      properties:
        category:
          oneOf:
          - $ref: '#/components/schemas/ContextCategory'
            description: How the subject of the assertion relates to the product, if stated.
          - type: 'null'
        confidence:
          type: number
          format: double
          description: The confidence of this context, applied to the evidence.
        context_id:
          type: string
          format: uuid
        context_identifier:
          type: string
          description: The product's identifier which matched.
        distance:
          type: integer
          format: int32
          description: Hops from the component (ancestor node) or SBOM (ancestor SBOM), 0 otherwise.
          minimum: 0
        name:
          type: string
          description: The name of the product, e.g. "Red Hat Storage 3".
        node_identifier:
          type: string
          description: 'The SBOM side identifier which matched: a CPE, or e.g. `sku:6925281924439`.'
        source:
          $ref: '#/components/schemas/ContextSource'
          description: Where the component got the matching identifier from.
    EvidenceDetail:
      type: object
      description: One piece of evidence from the correlation engine.
      required:
      - id
      - assertion_status
      - confidence
      - extractor
      - advisory_id
      - advisory_identifier
      - created_at
      properties:
        advisory_id:
          type: string
          format: uuid
        advisory_identifier:
          type: string
        advisory_type:
          type:
          - string
          - 'null'
          description: The format of the advisory (its `type` label), e.g. `csaf`, `cve` or `osv`.
        assertion_status:
          $ref: '#/components/schemas/AssertionStatus'
        confidence:
          type: number
          format: double
        confidence_factors:
          type: array
          items:
            $ref: '#/components/schemas/ConfidenceFactor'
          description: The factors of the confidence, empty for evidence extracted before they were recorded.
        contexts:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceContext'
          description: |-
            The products (assertion contexts) the evidence was matched in. Empty when the assertion
            has no context, or the SBOM nothing to compare it with.
        created_at:
          type: string
          format: date-time
        extractor:
          type: string
        id:
          type: string
          format: uuid
        matched_value:
          oneOf:
          - $ref: '#/components/schemas/MatchedValue'
          - type: 'null'
        provider:
          $ref: '#/components/schemas/ProviderResolution'
          description: The provider making the assertion, as resolved through provider aliases.
        provider_match:
          oneOf:
          - $ref: '#/components/schemas/ProviderMatch'
            description: How the provider matches the provider of the component, if at all.
          - type: 'null'
        remediations:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceRemediation'
          description: The remediations the advisory states for the matched statement.
    EvidenceOutcome:
      type: string
      enum:
      - selected
      - supporting
      - conflicting
      - non_voting
    EvidenceRemediation:
      type: object
      description: |-
        A remediation an advisory states for the statement of a piece of evidence, e.g. the version
        fixing it.
      required:
      - category
      properties:
        category:
          $ref: '#/components/schemas/RemediationCategory'
        details:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
    Exploit:
      type: object
      description: |-
        An assertion by some source that a vulnerability is exploited in the wild,
        or that working exploit code for it exists.

        The named fields are those every source can be expected to carry; everything
        specific to one source is in `metadata`. For CISA KEV, that is
        `vendor_project`, `product`, `vulnerability_name`, `short_description`,
        `required_action`, `known_ransomware_campaign_use`, `notes` and `cwes`.
      required:
      - id
      - source
      - cve_id
      - date_reported
      - remediation_due_date
      - metadata
      properties:
        cve_id:
          type: string
          description: The vulnerability this entry refers to.
        date_reported:
          type:
          - string
          - 'null'
          format: date
          description: The date the source first reported the exploitation.
        id:
          type: string
          description: Opaque identifier of this entry, stable across resyncs of the source.
        metadata:
          type: object
          description: Structured data specific to the reporting source.
        remediation_due_date:
          type:
          - string
          - 'null'
          format: date
          description: The date by which the source mandates remediation, if it mandates one.
        source:
          type: string
          description: The source that reported the exploitation (e.g. "cisa-kev").
    ExploitIntelligenceFinding:
      type: string
      description: |-
        Analysis finding from the Exploit Intelligence service.

        Represents the outcome of a vulnerability analysis for a given component/CVE pair.
      enum:
      - vulnerable
      - not_vulnerable
      - uncertain
    ExploitIntelligenceJobDetails:
      type: object
      description: Detailed view of an Exploit Intelligence analysis job.
      required:
      - id
      - sbom_id
      - vulnerability_id
      - status
      - components
      - created
      - updated
      properties:
        completed_components:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of completed components (computed at query time, not stored).
        components:
          type: array
          items:
            $ref: '#/components/schemas/ComponentResult'
          description: Per-component analysis results (populated for multi-component jobs).
        created:
          type: string
          description: Timestamp when the job was created.
        excluded_components:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of components excluded by the EI service (computed at query time, not stored).
        failed_components:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of genuinely failed components (computed at query time, not stored).
        finding:
          oneOf:
          - $ref: '#/components/schemas/ExploitIntelligenceFinding'
            description: Analysis result computed from component findings.
          - type: 'null'
        id:
          type: string
          format: uuid
          description: The unique job identifier.
        not_vulnerable_components:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of completed components with finding=not_vulnerable (computed at query time).
        product_id:
          type:
          - string
          - 'null'
          description: EI product ID for multi-component SPDX flow.
        report_url:
          type:
          - string
          - 'null'
          description: Link to the EI human-readable justification report.
        sbom_id:
          type: string
          format: uuid
          description: FK to the SBOM being analysed.
        status:
          $ref: '#/components/schemas/ExploitIntelligenceJobStatus'
          description: Current lifecycle status of the job.
        total_components:
          type:
          - integer
          - 'null'
          format: int32
          description: Total components in the product.
        uncertain_components:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of completed components with finding=uncertain (computed at query time).
        updated:
          type: string
          description: Timestamp when the job was last updated.
        vulnerability_id:
          type: string
          description: CVE identifier.
        vulnerable_components:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of completed components with finding=vulnerable (computed at query time).
    ExploitIntelligenceJobStatus:
      type: string
      description: Lifecycle status of an Exploit Intelligence analysis job.
      enum:
      - pending
      - running
      - completed
      - failed
    ExploitIntelligenceJobSummary:
      type: object
      description: Summary of an Exploit Intelligence analysis job.
      required:
      - id
      - sbom_id
      - vulnerability_id
      - status
      - created
      - updated
      properties:
        completed_components:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of completed components (computed at query time, not stored).
        created:
          type: string
          description: Timestamp when the job was created.
        excluded_components:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of components excluded by the EI service (computed at query time, not stored).
        failed_components:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of genuinely failed components (computed at query time, not stored).
        finding:
          oneOf:
          - $ref: '#/components/schemas/ExploitIntelligenceFinding'
            description: Analysis result from Exploit Intelligence.
          - type: 'null'
        id:
          type: string
          format: uuid
          description: The unique job identifier.
        not_vulnerable_components:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of completed components with finding=not_vulnerable (computed at query time).
        product_id:
          type:
          - string
          - 'null'
          description: EI product ID for multi-component SPDX flow.
        report_url:
          type:
          - string
          - 'null'
          description: Link to the EI human-readable justification report.
        sbom_id:
          type: string
          format: uuid
          description: FK to the SBOM being analysed.
        status:
          $ref: '#/components/schemas/ExploitIntelligenceJobStatus'
          description: Current lifecycle status of the job.
        total_components:
          type:
          - integer
          - 'null'
          format: int32
          description: Total components in the product.
        uncertain_components:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of completed components with finding=uncertain (computed at query time).
        updated:
          type: string
          description: Timestamp when the job was last updated.
        vulnerability_id:
          type: string
          description: CVE identifier.
        vulnerable_components:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of completed components with finding=vulnerable (computed at query time).
    ExternalReferenceQuery:
      type: object
      properties:
        cpe:
          oneOf:
          - $ref: '#/components/schemas/Cpe'
            description: Find by CPE
          - type: 'null'
        purl:
          oneOf:
          - $ref: '#/components/schemas/Purl'
            description: Find by PURL
          - type: 'null'
    ExtractPackage:
      type: object
      description: Information extracted from a package
      required:
      - purls
      properties:
        purls:
          type: array
          items:
            type: string
          description: PURLs found as alias for this package
    ExtractResult:
      type: object
      description: Information extracted from an SBOM
      required:
      - format
      - packages
      - warnings
      properties:
        format:
          $ref: '#/components/schemas/Format'
          description: the actual, concrete format
        packages:
          type: object
          description: packages of the SBOM
          additionalProperties:
            $ref: '#/components/schemas/ExtractPackage'
          propertyNames:
            type: string
        warnings:
          type: array
          items:
            type: string
          description: warnings while parsing
    ExtractionFreshness:
      type: object
      required:
      - status
      - required_revision
      properties:
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        completed_revision:
          type:
          - integer
          - 'null'
          format: int64
        required_revision:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/FreshnessStatus'
    ExtractionLag:
      type: object
      required:
      - pending_advisories
      - pending_sboms
      - failed
      properties:
        failed:
          type: integer
          format: int64
          description: Pending events that have failed at least once and will be retried.
          minimum: 0
        oldest_pending_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Enqueue time of the oldest pending event; null when caught up.
        pending_advisories:
          type: integer
          format: int64
          description: Pending advisory ingestion events, including failures awaiting retry.
          minimum: 0
        pending_sboms:
          type: integer
          format: int64
          description: Pending SBOM ingestion events, including failures awaiting retry.
          minimum: 0
    Finding:
      type: object
      description: A single validation finding produced by a validator.
      required:
      - severity
      - message
      properties:
        message:
          type: string
          description: Human-readable description of the finding.
        path:
          type:
          - string
          - 'null'
          description: Location within the document (e.g. a JSONPath), when available.
        rule:
          type:
          - string
          - 'null'
          description: Identifier of the rule that produced the finding, when available.
        severity:
          $ref: '#/components/schemas/ValidationSeverity'
          description: The severity of this finding.
    Format:
      type: string
      enum:
      - osv
      - csaf
      - cve
      - nvd
      - spdx
      - cyclonedx
      - clearlydefinedcuration
      - clearlydefined
      - cwecatalog
      - cisakev
      - advisory
      - sbom
      - unknown
    FreshnessOverview:
      type: object
      required:
      - revision
      - checked_at
      - total
      - current
      - stale
      - unknown
      - needs_refresh
      properties:
        active_job:
          oneOf:
          - $ref: '#/components/schemas/RefreshJob'
          - type: 'null'
        checked_at:
          type: string
          format: date-time
        current:
          type: integer
          format: int64
          minimum: 0
        extraction_lag:
          oneOf:
          - $ref: '#/components/schemas/ExtractionLag'
            description: |-
              Ingestion changes whose background extraction has not committed yet.
              Absent when talking to a server without durable extraction tracking.
          - type: 'null'
        latest_job:
          oneOf:
          - $ref: '#/components/schemas/RefreshJob'
          - type: 'null'
        needs_refresh:
          type: integer
          format: int64
          minimum: 0
        revision:
          type: integer
          format: int64
        stale:
          type: integer
          format: int64
          minimum: 0
        total:
          type: integer
          format: int64
          minimum: 0
        unknown:
          type: integer
          format: int64
          minimum: 0
    FreshnessStatus:
      type: string
      enum:
      - current
      - stale
      - unknown
    FrontendInfo:
      type: object
      description: Frontend configuration exposed via `/.well-known/trustify`.
      properties:
        oidc:
          oneOf:
          - $ref: '#/components/schemas/FrontendOidcInfo'
          - type: 'null'
    FrontendOidcInfo:
      type: object
      description: OIDC configuration for frontend clients.
      required:
      - issuerUrl
      - clientId
      - scope
      properties:
        clientId:
          type: string
        issuerUrl:
          type: string
        scope:
          type: string
    Group:
      type: object
      required:
      - id
      - name
      properties:
        description:
          type:
          - string
          - 'null'
          description: A user friendly description
        id:
          type: string
          description: The ID of the group
        labels:
          $ref: '#/components/schemas/Labels'
          description: Additional group labels
        name:
          type: string
          description: The name of the group, in the context of its parent
        parent:
          type:
          - string
          - 'null'
          description: The direct parent of this group
    GroupListResult:
      allOf:
      - $ref: '#/components/schemas/PaginatedResults_GroupDetails'
      - type: object
        properties:
          referenced:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/Group'
            description: |-
              Groups referenced by parent chains but not present in the primary result set.

              Only present when `parents=resolve` is requested.
      description: Result of listing SBOM groups, with optional resolved parent references.
    GroupRequest:
      type: object
      description: Mutable properties of a [`Group`].
      required:
      - name
      properties:
        description:
          type:
          - string
          - 'null'
          description: A user provided description
        labels:
          $ref: '#/components/schemas/Labels'
        name:
          type: string
          description: The name of the group.
        parent:
          type:
          - string
          - 'null'
          description: The ID of the group's parent.
    HttpDiscovery:
      oneOf:
      - type: object
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - pulp
      description: Pluggable file-discovery strategy for the HTTP importer.
    HttpImporter:
      allOf:
      - $ref: '#/components/schemas/CommonImporter'
      - type: object
        required:
        - source
        - discovery
        properties:
          auth:
            oneOf:
            - $ref: '#/components/schemas/AuthConfig'
              description: Optional authentication configuration for accessing the source.
            - type: 'null'
          discovery:
            $ref: '#/components/schemas/HttpDiscovery'
            description: File-discovery strategy used to enumerate files in the source.
          fetchRetries:
            type:
            - integer
            - 'null'
            description: |-
              Number of fetch retries for individual file downloads.
              Defaults to the fetcher's built-in retry count when absent.
            minimum: 0
          onlyPatterns:
            type: array
            items:
              type: string
            description: |-
              Optional list of regex patterns restricting which discovered files are
              imported. An empty list imports all discovered files.
          source:
            type: string
            description: Base URL of the HTTP repository to import documents from.
      description: |-
        Configuration for the HTTP-based importer.

        Fetches documents from an HTTP repository, using a pluggable
        discovery strategy to enumerate files and an optional credential
        for authenticated sources.
    Id:
      type: string
      description: |-
        Identifier to a document, prefixed with the ID type.

        Either an internal ID of the document with the `urn:uuid:` scheme. Or using a digest, with the digest prefix. For example, `sha256:`.
      examples:
      - urn:uuid:018123ef-a791-40d8-b62a-f70a350245d4
      - sha256:dc60aeb735c16a71b6fc56e84ddb8193e3a6d1ef0b7e958d77e78fc039a5d04e
    IdentifierKind:
      type: string
      description: The kind of an identifier used for correlation.
      enum:
      - digest
      - purl
      - cpe
      - model_number
      - serial_number
      - sku
    IdentifierRef:
      type: object
      description: |-
        An identifier of a specific kind.

        Digests use the format `<algorithm>:<value>`.
      required:
      - kind
      - value
      properties:
        kind:
          $ref: '#/components/schemas/IdentifierKind'
        value:
          type: string
    Importer:
      allOf:
      - $ref: '#/components/schemas/ImporterData'
      - type: object
        required:
        - name
        properties:
          name:
            type: string
    ImporterConfiguration:
      oneOf:
      - type: object
        required:
        - sbom
        properties:
          sbom:
            $ref: '#/components/schemas/SbomImporter'
      - type: object
        required:
        - csaf
        properties:
          csaf:
            $ref: '#/components/schemas/CsafImporter'
      - type: object
        required:
        - osv
        properties:
          osv:
            $ref: '#/components/schemas/OsvImporter'
      - type: object
        required:
        - cve
        properties:
          cve:
            $ref: '#/components/schemas/CveImporter'
      - type: object
        required:
        - nvd
        properties:
          nvd:
            $ref: '#/components/schemas/NvdImporter'
      - type: object
        required:
        - clearlyDefined
        properties:
          clearlyDefined:
            $ref: '#/components/schemas/ClearlyDefinedImporter'
      - type: object
        required:
        - clearlyDefinedCuration
        properties:
          clearlyDefinedCuration:
            $ref: '#/components/schemas/ClearlyDefinedCurationImporter'
      - type: object
        required:
        - cwe
        properties:
          cwe:
            $ref: '#/components/schemas/CweImporter'
      - type: object
        required:
        - kev
        properties:
          kev:
            $ref: '#/components/schemas/KevImporter'
      - type: object
        required:
        - quay
        properties:
          quay:
            $ref: '#/components/schemas/QuayImporter'
      - type: object
        required:
        - http
        properties:
          http:
            $ref: '#/components/schemas/HttpImporter'
    ImporterData:
      type: object
      required:
      - configuration
      - state
      - lastChange
      properties:
        configuration:
          $ref: '#/components/schemas/ImporterConfiguration'
        continuation:
          description: The continuation token of the importer.
        lastChange:
          type: string
          format: date-time
          description: The last state change
        lastError:
          type:
          - string
          - 'null'
          description: The error of the last run (empty if successful)
        lastRun:
          type:
          - string
          - 'null'
          format: date-time
          description: The last run (successful or not)
        lastSuccess:
          type:
          - string
          - 'null'
          format: date-time
          description: The last successful run
        progress:
          $ref: '#/components/schemas/Progress'
          description: The current progress.
        state:
          $ref: '#/components/schemas/State'
          description: The current state of the importer
    ImporterReport:
      type: object
      required:
      - id
      - importer
      - creation
      properties:
        creation:
          type: string
          format: date-time
          description: The time the report was created
        error:
          type:
          - string
          - 'null'
          description: Errors captured by the report
        id:
          type: string
          description: The ID of the report
        importer:
          type: string
          description: The name of the importer this report belongs to
        report:
          oneOf:
          - $ref: '#/components/schemas/Report'
            description: Detailed report information
          - type: 'null'
    IngestFromUrlRequest:
      type: object
      description: Request body for ingesting a document from a remote URL.
      required:
      - url
      properties:
        url:
          type: string
          description: The URL of the document to download and ingest.
    IngestResult:
      type: object
      description: The result of the ingestion process
      required:
      - id
      properties:
        document_id:
          type:
          - string
          - 'null'
          description: The ID declared by the document
        duplicate:
          type: boolean
          description: True when the document already existed; no new data was ingested.
        id:
          $ref: '#/components/schemas/Id'
          description: The internal ID of the document
        validation:
          type: array
          items:
            $ref: '#/components/schemas/ValidationReport'
          description: |-
            Structured reports from semantic validators run during ingestion.

            See ADR 00020. Empty when no validators are configured or none apply
            to the document's format.
        warnings:
          type: array
          items:
            type: string
          description: Warnings that occurred during the import process
    KevImporter:
      allOf:
      - $ref: '#/components/schemas/CommonImporter'
        description: Common importer options.
      - type: object
        properties:
          catalog:
            type:
            - string
            - 'null'
            description: |-
              Catalog source identifier under which the imported entries are stored
              (and replaced on each run). Defaults to "cisa-kev".
          source:
            type: string
            description: URL of the catalog document to import.
      description: |-
        Importer configuration for known-exploited-vulnerability catalogs
        (e.g. CISA KEV).
    Labels:
      type: object
      additionalProperties:
        type: string
    LicenseCategory:
      type: string
      enum:
      - declared
      - concluded
    LicenseInfo:
      type: object
      required:
      - license_name
      - license_type
      properties:
        license_name:
          type: string
        license_type:
          $ref: '#/components/schemas/LicenseCategory'
    LicenseRefMapping:
      type: object
      required:
      - license_id
      - license_name
      properties:
        license_id:
          type: string
        license_name:
          type: string
    LicenseSummary:
      type: object
      required:
      - id
      - license
      - spdx_licenses
      - spdx_license_exceptions
      - purls
      properties:
        id:
          type: string
        license:
          type: string
        purls:
          type: integer
          format: int64
          minimum: 0
        spdx_license_exceptions:
          type: array
          items:
            type: string
        spdx_licenses:
          type: array
          items:
            type: string
    LicenseText:
      type: object
      required:
      - license
      properties:
        license:
          type: string
    MatchedRange:
      type: object
      description: A version range of an advisory assertion. A missing bound is unbounded.
      required:
      - scheme
      properties:
        high:
          oneOf:
          - $ref: '#/components/schemas/RangeBound'
          - type: 'null'
        low:
          oneOf:
          - $ref: '#/components/schemas/RangeBound'
          - type: 'null'
        scheme:
          type: string
          description: The version scheme, e.g. `rpm` or `semver`.
    MatchedValue:
      type: object
      description: 'The advisory side of a match: what an SBOM identifier was matched against.'
      required:
      - identifier
      properties:
        enabled_by:
          oneOf:
          - $ref: '#/components/schemas/EnabledBy'
            description: The option which enabled the match, if it depends on one.
          - type: 'null'
        identifier:
          type: string
          description: |-
            The advisory identifier which matched, e.g. a PURL without a version, a CPE pattern, or a
            digest.
        origin:
          $ref: '#/components/schemas/AssertionOrigin'
          description: The origin of the matching status, independent of the extractor's ID and confidence.
        ranges:
          type: array
          items:
            $ref: '#/components/schemas/MatchedRange'
          description: |-
            The version ranges of the assertion which contain the SBOM version.

            Empty when no version range was involved in the match.
        source_provider:
          oneOf:
          - $ref: '#/components/schemas/ProviderIdentity'
            description: The source of this assertion, when it differs from the document-level publisher.
          - type: 'null'
    Message:
      type: object
      required:
      - severity
      - message
      properties:
        message:
          type: string
          description: The message
        severity:
          $ref: '#/components/schemas/Severity'
          description: The severity of the message
    Node:
      allOf:
      - $ref: '#/components/schemas/BaseSummary'
      - type: object
        properties:
          ancestors:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/Node'
            description: All ancestors of this node. [`None`] if not requested on this level.
          descendants:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/Node'
            description: All descendents of this node. [`None`] if not requested on this level.
          relationship:
            oneOf:
            - $ref: '#/components/schemas/Relationship'
              description: The relationship the node has to it's containing node, if any.
            - type: 'null'
          warnings:
            type: array
            items:
              type: string
            description: Warnings when processing this node.
    NvdImporter:
      allOf:
      - $ref: '#/components/schemas/CommonImporter'
      - type: object
        properties:
          source:
            type: string
            description: |-
              The base URL of the GitHub repository publishing NVD data as per-year
              release assets (`CVE-<year>.json.xz` + `.meta`), in the NVD-API JSON
              schema. The latest release is always used.
          startYear:
            type:
            - integer
            - 'null'
            format: int32
            description: |-
              The first feed year to import when `years` is empty; all years from
              here through the current year are imported. Defaults to 1999, the
              first year with NVD data.
            minimum: 0
          years:
            type: array
            items:
              type: integer
              format: int32
              minimum: 0
            description: |-
              An explicit set of feed years to import. When non-empty, exactly these
              years are imported and `start_year` is ignored.
            uniqueItems: true
    OrganizationDetails:
      allOf:
      - $ref: '#/components/schemas/OrganizationHead'
      - type: object
        required:
        - advisories
        properties:
          advisories:
            type: array
            items:
              $ref: '#/components/schemas/AdvisoryHead'
            description: Advisories issued by the organization, if any.
    OrganizationHead:
      type: object
      description: |-
        An organization who may issue advisories, product SBOMs, or
        otherwise be involved in supply-chain evidence.
      required:
      - id
      - name
      - cpe_key
      - website
      properties:
        cpe_key:
          type:
          - string
          - 'null'
          description: The `CPE` key of the organization, if known.
        id:
          type: string
          format: uuid
          description: The opaque UUID of the organization.
        name:
          type: string
          description: The name of the organization.
        website:
          type:
          - string
          - 'null'
          description: The website of the organization, if known.
    OrganizationSummary:
      allOf:
      - $ref: '#/components/schemas/OrganizationHead'
    OsvImporter:
      allOf:
      - $ref: '#/components/schemas/CommonImporter'
      - type: object
        required:
        - source
        properties:
          branch:
            type:
            - string
            - 'null'
            description: An optional branch. Will use the default branch otherwise.
          path:
            type:
            - string
            - 'null'
            description: An optional path to start searching for documents. Will use the root of the repository otherwise.
          source:
            type: string
            description: The URL to the git repository of the OSV data
          startYear:
            type:
            - integer
            - 'null'
            format: int32
            minimum: 0
          years:
            type: array
            items:
              type: integer
              format: int32
              minimum: 0
            uniqueItems: true
    PaginatedResults_AdvisorySummary:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/AdvisoryHead'
            - $ref: '#/components/schemas/SourceDocument'
              description: Information pertaning to the underlying source document, if any.
            - type: object
              required:
              - vulnerabilities
              properties:
                vulnerabilities:
                  type: array
                  items:
                    $ref: '#/components/schemas/AdvisoryVulnerabilityHead'
                  description: Vulnerabilities addressed within this advisory.
        total:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    PaginatedResults_BasePurlSummary:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/BasePurlHead'
        total:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    PaginatedResults_CryptoAlgorithmSummary:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            description: Summary of a cryptographic asset found in SBOMs.
            required:
            - sbom_id
            - node_id
            - name
            - asset_type
            - oid
            - primitive
            - properties
            - policy_status
            - packages_count
            - sboms_count
            - recommendation
            properties:
              asset_type:
                $ref: '#/components/schemas/CryptoAssetType'
              name:
                type: string
              node_id:
                type: string
              oid:
                type:
                - string
                - 'null'
              packages_count:
                type: integer
                format: int64
              policy_status:
                $ref: '#/components/schemas/PolicyVerdict'
              primitive:
                type:
                - string
                - 'null'
              properties:
                type: object
              recommendation:
                type:
                - string
                - 'null'
                description: NIST PQC replacement recommendation for this algorithm, if a mapping exists.
              sbom_id:
                type: string
                format: uuid
              sboms_count:
                type: integer
                format: int64
        total:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    PaginatedResults_Exploit:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            description: |-
              An assertion by some source that a vulnerability is exploited in the wild,
              or that working exploit code for it exists.

              The named fields are those every source can be expected to carry; everything
              specific to one source is in `metadata`. For CISA KEV, that is
              `vendor_project`, `product`, `vulnerability_name`, `short_description`,
              `required_action`, `known_ransomware_campaign_use`, `notes` and `cwes`.
            required:
            - id
            - source
            - cve_id
            - date_reported
            - remediation_due_date
            - metadata
            properties:
              cve_id:
                type: string
                description: The vulnerability this entry refers to.
              date_reported:
                type:
                - string
                - 'null'
                format: date
                description: The date the source first reported the exploitation.
              id:
                type: string
