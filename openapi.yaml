        in: query
        description: Optional issuer if it cannot be determined from document contents.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: labels
        in: query
        description: |-
          Optional labels.

          Only use keys with a prefix of `labels.`
        required: true
        schema:
          $ref: '#/components/schemas/Labels'
      - name: format
        in: query
        description: Optional format hint. Defaults to auto-detection.
        required: false
        schema:
          type: string
          enum:
          - osv
          - csaf
          - cve
          - nvd
          - spdx
          - cyclonedx
          - clearlydefinedcuration
          - clearlydefined
          - cwecatalog
          - cisakev
          - advisory
          - sbom
          - unknown
      requestBody:
        content:
          application/json:
            schema:
              type: string
              format: binary
        required: true
      responses:
        '201':
          description: Document ingested successfully
        '400':
          description: The file could not be parsed
        '401':
          description: The user was not authenticated
        '403':
          description: Insufficient permissions for this document type
