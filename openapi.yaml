        node_id:
          type: string
        product_name:
          type: string
        product_version:
          type: string
        published:
          type: string
        purl:
          type: array
          items:
            $ref: '#/components/schemas/Purl'
        sbom_id:
          type: string
        version:
          type: string
    BinaryByteSize:
      type: string
    BulkAssignmentRequest:
      type: object
      description: Request to assign multiple SBOMs to the same set of groups.
      required:
      - sbom_ids
      - group_ids
      properties:
        group_ids:
          type: array
          items:
            type: string
          description: The group IDs to assign to each SBOM (replaces existing assignments).
        sbom_ids:
          type: array
          items:
            type: string
          description: The IDs of the SBOMs to update.
    ByteSizeDef:
      type: string
    CacheStatusDetails:
      type: object
      required:
      - capacity
      - free
      - usage
      - entries
      properties:
        capacity:
          type: integer
          format: int64
          description: The maximum number of bytes the cache will hold
          minimum: 0
        entries:
          type: array
          items:
            $ref: '#/components/schemas/CacheStatusEntry'
          description: Entries in the cache
        free:
          type: integer
          format: int64
          description: The number of bytes which are still free
          minimum: 0
        usage:
          type: number
          format: double
          description: The percentage the cache is filled (0..1)
    CacheStatusEntry:
      type: object
      required:
      - sbom_id
      - size
      - size_human
      - nodes
      - edges
      properties:
        edges:
          type: integer
          format: int64
          description: The number of edges in the graph
          minimum: 0
        nodes:
          type: integer
          format: int64
          description: The number of nodes in the graph
          minimum: 0
        sbom_id:
          type: string
          description: The ID of the SBOM
        size:
          type: integer
          format: int64
          description: The size of the cache entry, in bytes
          minimum: 0
        size_human:
          $ref: '#/components/schemas/ByteSizeDef'
          description: A human-readable version of `size`
    ClearlyDefinedCurationImporter:
      allOf:
      - $ref: '#/components/schemas/CommonImporter'
      - type: object
        properties:
          source:
            type: string
          types:
            type: array
            items:
              $ref: '#/components/schemas/ClearlyDefinedPackageType'
            uniqueItems: true
    ClearlyDefinedImporter:
      allOf:
      - $ref: '#/components/schemas/CommonImporter'
      - type: object
        properties:
          source:
            type: string
          types:
            type: array
            items:
              $ref: '#/components/schemas/ClearlyDefinedPackageType'
            uniqueItems: true
    ClearlyDefinedPackageType:
      type: string
      enum:
      - composer
      - crate
      - deb
      - gem
      - git
      - go
      - maven
      - npm
      - nuget
      - pod
      - pypi
    CommonImporter:
      type: object
      required:
      - period
      properties:
        description:
          type:
          - string
          - 'null'
          description: A description for users.
        disabled:
          type: boolean
          description: A flag to disable the importer, without deleting it.
        labels:
          $ref: '#/components/schemas/Labels'
          description: Labels which will be applied to the ingested documents.
        period:
          type: string
          description: The period the importer should be run.
    ComponentRef:
      type: object
      description: A component and the identifiers attached to it.
      required:
      - node_id
      - name
      - identifiers
      properties:
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/IdentifierRef'
        name:
          type: string
        node_id:
          type: string
    ComponentResult:
      type: object
      description: Per-component analysis result within an analysis job.
      required:
      - id
      - component_ref
      - status
      - excluded
      - created
      - updated
      properties:
        advisory_id:
          type:
          - string
          - 'null'
          format: uuid
          description: FK to advisory — set when a VEX document is ingested from the result.
        component_ref:
          type: string
          description: Identifier of the component (purl or container image reference).
        created:
          type: string
          description: Timestamp when the component record was created.
        excluded:
          type: boolean
          description: |-
            Whether this component was excluded by the EI service (e.g.,
            unsupported ecosystem) rather than genuinely failing.
        finding:
          oneOf:
          - $ref: '#/components/schemas/ExploitIntelligenceFinding'
            description: Analysis result from Exploit Intelligence, if completed.
          - type: 'null'
        id:
          type: string
          format: uuid
          description: The unique component record identifier.
        report_url:
          type:
          - string
          - 'null'
          description: Link to the EI human-readable justification report for this component.
        status:
          $ref: '#/components/schemas/ExploitIntelligenceJobStatus'
          description: Current lifecycle status of this component's analysis.
        updated:
          type: string
          description: Timestamp when the component record was last updated.
    ConfidenceCatalog:
      type: object
      description: All factors a match confidence can be made of, as currently configured.
      required:
      - factors
      - wildcard_cpe
      properties:
        factors:
          type: array
          items:
            $ref: '#/components/schemas/ConfidenceFactorInfo'
        wildcard_cpe:
          type: number
          format: double
          description: Multiplier of a product confirmed through a CPE attribute of ANY, instead of equal values.
    ConfidenceFactor:
      type: object
      description: |-
        One factor of a match confidence, and why it applies. The match confidence is the product of
        its factors.
      required:
      - reason
      - factor
      properties:
        factor:
          type: number
          format: double
        reason:
          $ref: '#/components/schemas/ConfidenceReason'
    ConfidenceFactorInfo:
      type: object
      description: A factor a match confidence can have.
      required:
      - reason
      - factor
      properties:
        factor:
          type: number
          format: double
          description: The factor, for an ancestor at distance 1.
        per_hop:
          oneOf:
          - $ref: '#/components/schemas/PerHop'
            description: How the factor decreases with each further hop to an ancestor.
          - type: 'null'
        reason:
          $ref: '#/components/schemas/ConfidenceReason'
    ConfidenceReason:
      oneOf:
      - type: object
        description: A file digest is equal.
        required:
        - kind
        properties:
          kind:
            type: string
            enum:
            - digest
      - type: object
        description: A product identifier (SKU, model or serial number) matches.
        required:
        - kind
        properties:
          kind:
            type: string
            enum:
            - product_identifier
      - type: object
        description: The advisory CPE states the version, which the SBOM version equals.
        required:
        - kind
        properties:
          kind:
            type: string
            enum:
            - cpe_exact_version
      - type: object
        description: The advisory CPE has any version, and the SBOM version is in the assertion's range.
        required:
        - kind
        properties:
          kind:
            type: string
            enum:
            - cpe_version_range
      - type: object
        description: 'The advisory CPE has any version, without a range: all versions match.'
        required:
        - kind
        properties:
          kind:
            type: string
            enum:
            - cpe_any_version
      - type: object
        description: The PURL is in a range the advisory states.
        required:
        - kind
        properties:
          kind:
            type: string
            enum:
            - purl
      - type: object
        description: The release streams of an RPM (e.g. `el8_6`) and the statement relate.
        required:
        - stream
        - kind
        properties:
          kind:
            type: string
            enum:
            - rpm_stream
          stream:
            $ref: '#/components/schemas/StreamRelation'
      - type: object
        description: A rule derived the range from what the advisory states, e.g. `purl_first_fixed`.
        required:
        - rule
        - kind
        properties:
          kind:
            type: string
            enum:
            - rule
          rule:
            type: string
      - type: object
        description: The status is the advisory's default for versions it doesn't list.
        required:
        - kind
        properties:
          kind:
            type: string
            enum:
            - default_status
      - type: object
        description: The component is in the product the statement is about.
        required:
        - source
        - distance
        - kind
        properties:
          distance:
            type: integer
            format: int32
            minimum: 0
          kind:
            type: string
            enum:
            - product_confirmed
          source:
            $ref: '#/components/schemas/ContextSource'
          source_factor:
            type:
            - number
            - 'null'
            format: double
            description: Confidence assigned to the source and its distance; absent in older evidence.
          wildcard_factor:
            type:
            - number
            - 'null'
            format: double
            description: CPE wildcard multiplier, or 1.0 for an exact match; absent in older evidence.
      - type: object
        description: Nothing in the SBOM confirms the product the statement is about.
        required:
        - kind
        properties:
          kind:
            type: string
            enum:
            - product_not_confirmed
      description: Why a factor applies to a match confidence.
    ContextCategory:
      type: string
      description: How the subject of an assertion relates to its context (CSAF relationship categories).
      enum:
      - default_component_of
      - external_component_of
      - installed_on
      - installed_with
      - optional_component_of
    ContextSource:
      type: string
      description: Where an SBOM component got a CPE putting it into a product from.
      enum:
      - node
      - ancestor_node
      - describing
      - ancestor_sbom
      - purl_qualifier
      - purl_release
      - unconfirmed
    CorrelationOption:
      allOf:
      - $ref: '#/components/schemas/CorrelationOptionData'
      - type: object
        required:
        - id
        properties:
          id:
            type: string
            format: uuid
      description: |-
        An option of the correlation engine, for the advisories of one publisher.

        A changed option applies to documents extracted afterwards.
    CorrelationOptionData:
      type: object
      description: The settable content of a correlation option.
      required:
      - key
      - publisher_namespace
      - value
      properties:
        key:
          $ref: '#/components/schemas/CorrelationOptionKey'
        publisher_namespace:
          type: string
          description: |-
            The publisher namespace of the advisories the option applies to, e.g.
            `https://www.redhat.com`.
        reason:
          type:
          - string
          - 'null'
          description: Why the option is set, shown with the evidence it enables.
        value:
          type: object
          description: The value, its type depends on the key.
    CorrelationOptionKey:
      type: string
      description: The options of the correlation engine.
      enum:
      - versionless_purl
      - fixed_is_first_fixed
    CorrelationResult:
      type: object
      description: Top-level correlation result for an SBOM.
      required:
      - sbom_id
      - verdicts
      properties:
        freshness:
          $ref: '#/components/schemas/ExtractionFreshness'
        sbom_id:
          type: string
          format: uuid
        sbom_name:
          type:
          - string
          - 'null'
          description: The name of the SBOM. Absent if the SBOM doesn't exist.
        unmatched_components:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ComponentRef'
          description: |-
            Components in the SBOM that have no correlation evidence.

            `None` when not requested, `Some(vec)` when `include_unmatched=true`.
        verdicts:
          type: array
          items:
            $ref: '#/components/schemas/VerdictSummary'
    Cpe:
      type: string
      format: uri
    CreateResponse:
      type: object
      description: The ID of a created option.
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
    CredentialSource:
      oneOf:
      - type: object
        description: |-
          Literal value stored in the database.

          **Security:** the credential is stored in plaintext in the database.
          Prefer [`CredentialSource::Env`] or [`CredentialSource::File`] for production use.
        required:
        - value
        - type
        properties:
          type:
            type: string
            enum:
            - inline
          value:
            type: string
            description: |-
              Literal value stored in the database.

              **Security:** the credential is stored in plaintext in the database.
              Prefer [`CredentialSource::Env`] or [`CredentialSource::File`] for production use.
      - type: object
        description: Name of an environment variable read at import time.
        required:
        - value
        - type
        properties:
          type:
            type: string
            enum:
            - env
          value:
            type: string
            description: Name of an environment variable read at import time.
      - type: object
        description: Filesystem path to a file whose content is read at import time.
        required:
        - value
        - type
        properties:
          type:
            type: string
            enum:
            - file
          value:
            type: string
            description: Filesystem path to a file whose content is read at import time.
      description: |-
        How a credential value is sourced at import time.

        Inline stores the value directly (dev only). Env and File store
        only a reference — the value is resolved from the environment or
        filesystem at each import run, enabling K8s Secret rotation.
    CryptoAlgorithmSummary:
      type: object
      description: Summary of a cryptographic asset found in SBOMs.
      required:
      - sbom_id
      - node_id
      - name
      - asset_type
      - oid
      - primitive
      - properties
      - policy_status
      - packages_count
      - sboms_count
      - recommendation
      properties:
        asset_type:
          $ref: '#/components/schemas/CryptoAssetType'
        name:
          type: string
        node_id:
          type: string
        oid:
          type:
          - string
          - 'null'
        packages_count:
          type: integer
          format: int64
        policy_status:
          $ref: '#/components/schemas/PolicyVerdict'
        primitive:
          type:
          - string
          - 'null'
        properties:
          type: object
        recommendation:
