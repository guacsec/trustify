      type: string
      description: How the provider of an assertion matches the provider of the SBOM component.
      enum:
      - provider
      - name
    ProviderRelationship:
      type: string
      description: Provider precedence, ordered from most to least preferred.
      enum:
      - matching_provider
      - matching_name
      - providerless
      - other
    ProviderResolution:
      type: object
      required:
      - source
      - identifiers
      - diagnostics
      properties:
        diagnostics:
          type: array
          items:
            type: string
        identifiers:
          type: array
          items:
            type: string
        provider:
          type:
          - string
          - 'null'
        source:
          type: string
    Purl:
      type: string
      format: uri
    PurlAdvisory:
      allOf:
      - $ref: '#/components/schemas/AdvisoryHead'
      - type: object
        required:
        - status
        properties:
          status:
            type: array
            items:
              $ref: '#/components/schemas/PurlStatus'
    PurlDetails:
      allOf:
      - $ref: '#/components/schemas/PurlHead'
      - type: object
        required:
        - version
        - base
        - advisories
        - licenses
        - licenses_ref_mapping
        properties:
          advisories:
            type: array
            items:
              $ref: '#/components/schemas/PurlAdvisory'
            description: |-
              The advisories with a status of the PURL.

              Deprecated: use the correlation engine, `GET /v3/correlation/query`.
            deprecated: true
          base:
            $ref: '#/components/schemas/BasePurlHead'
          licenses:
            type: array
            items:
              $ref: '#/components/schemas/LicenseInfo'
          licenses_ref_mapping:
            type: array
            items:
              $ref: '#/components/schemas/LicenseRefMapping'
            deprecated: true
          version:
            $ref: '#/components/schemas/VersionedPurlHead'
    PurlHead:
      type: object
      required:
      - uuid
      - purl
      properties:
        purl:
          $ref: '#/components/schemas/Purl'
          description: The actual qualified PURL
        uuid:
          type: string
          format: uuid
          description: The ID of the qualified PURL
    PurlStatus:
      type: object
      required:
      - vulnerability
      - advisory
      - scores
      - status
      - context
      - fixed_versions
      properties:
        advisory:
          $ref: '#/components/schemas/AdvisoryHead'
        context:
          oneOf:
          - $ref: '#/components/schemas/StatusContext'
          - type: 'null'
        fixed_versions:
          type: array
          items:
            type: string
        scores:
          type: array
          items:
            $ref: '#/components/schemas/ScoredVector'
          description: All CVSS scores associated with the vulnerability
        status:
          type: string
        version_range:
          oneOf:
          - $ref: '#/components/schemas/VersionRange'
          - type: 'null'
        vulnerability:
          $ref: '#/components/schemas/VulnerabilityHead'
    PurlSummary:
      allOf:
      - $ref: '#/components/schemas/PurlHead'
      - type: object
        required:
        - base
        - version
        - qualifiers
        properties:
          base:
            $ref: '#/components/schemas/BasePurlHead'
          qualifiers:
            type: object
            additionalProperties:
              type: string
            propertyNames:
              type: string
            deprecated: true
          version:
            $ref: '#/components/schemas/VersionedPurlHead'
    QuayImporter:
      allOf:
      - $ref: '#/components/schemas/CommonImporter'
      - type: object
        properties:
          auth:
            oneOf:
            - $ref: '#/components/schemas/AuthConfig'
              description: Authentication configuration for accessing the Quay registry.
            - type: 'null'
          concurrency:
            type:
            - integer
            - 'null'
            description: The maximum concurrent repository fetches
            minimum: 0
          namespace:
            type:
            - string
            - 'null'
            description: The namespace of the registry to "walk"
          sizeLimit:
            oneOf:
            - $ref: '#/components/schemas/BinaryByteSize'
              description: The max size of the ingested SBOM's (None is unlimited)
            - type: 'null'
          source:
            type: string
            description: The name of the quay registry, e.g. quay.io
          unencrypted:
            type: boolean
            description: Whether the scheme used is 'http' [true] or 'https' [false]
    QueryMatch:
      type: object
      description: A single match from the query (evidence within a verdict group).
      required:
      - kind
      - value
      - advisory_id
      - advisory_identifier
      - status
      - extractor
      - confidence
      properties:
        advisory_id:
          type: string
          format: uuid
        advisory_identifier:
          type: string
        advisory_type:
          type:
          - string
          - 'null'
          description: The format of the advisory (its `type` label), e.g. `csaf`, `cve` or `osv`.
        confidence:
          type: number
          format: double
        extractor:
          type: string
          description: The type of evidence, i.e. how the match was established (e.g. `purl` or `purl_stream`).
        kind:
          $ref: '#/components/schemas/IdentifierKind'
        remediations:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceRemediation'
          description: Remediations of the matched source statements, scoped by the same product matching.
        status:
          $ref: '#/components/schemas/AssertionStatus'
        value:
          $ref: '#/components/schemas/MatchedValue'
    QueryResult:
      type: object
      description: Result of a manual identifier query, grouped by vulnerability with resolved verdicts.
      required:
      - query
      - verdicts
      properties:
        query:
          $ref: '#/components/schemas/IdentifierRef'
          description: The identifier which was queried.
        verdicts:
          type: array
          items:
            $ref: '#/components/schemas/QueryVerdict'
    QueryVerdict:
      allOf:
      - $ref: '#/components/schemas/ResolutionSummary'
      - type: object
        required:
        - vulnerability_id
        - status
        - matches
        properties:
          matches:
            type: array
            items:
              $ref: '#/components/schemas/QueryMatch'
          status:
            $ref: '#/components/schemas/VerdictStatus'
          vulnerability_id:
            type: string
          vulnerability_title:
            type:
            - string
            - 'null'
      description: Resolved verdict for a single vulnerability from an ad-hoc identifier query.
    RangeBound:
      type: object
      description: One bound of a [`MatchedRange`].
      required:
      - version
      - inclusive
      properties:
        inclusive:
          type: boolean
        version:
          type: string
    RecommendEntry:
      type: object
      required:
      - package
      - vulnerabilities
      properties:
        package:
          type: string
        vulnerabilities:
          type: array
          items:
            $ref: '#/components/schemas/VulnerabilityStatus'
    RecommendReportImpactSummary:
      type: object
      description: High-level impact summary for a recommendation report.
      required:
      - sboms_with_recommendations
      - addressable_packages
      properties:
        addressable_packages:
          type: integer
          description: Count of distinct upstream packages that have a vendor recommendation.
          minimum: 0
        sboms_with_recommendations:
          type: integer
          description: Number of SBOMs containing at least one package with a vendor recommendation.
          minimum: 0
    RecommendReportPackage:
      type: object
      description: A deduplicated package entry in a recommendation report.
      required:
      - purl
      - recommended_purl
      - vulnerabilities
      - found_in
      properties:
        advisory_id:
          type:
          - string
          - 'null'
          description: Advisory ID that provides provenance for the recommendation.
        found_in:
          type: array
          items:
            type: string
            format: uuid
          description: IDs of the SBOMs that contain this upstream package.
        purl:
          type: string
          description: The upstream package PURL (type+namespace+name+version, no qualifiers).
        recommended_purl:
          type: string
          description: The recommended vendor-rebuilt PURL.
        vulnerabilities:
          type: array
          items:
            type: string
          description: CVE identifiers associated with this recommendation.
    RecommendReportRequest:
      type: object
      description: Request body for the `POST /api/v3/purl/recommend/report` endpoint.
      required:
      - sbom_ids
      properties:
        sbom_ids:
          type: array
          items:
            type: string
            format: uuid
          description: SBOM IDs to include in the report.
    RecommendReportResponse:
      type: object
      description: Aggregated recommendation report for a set of SBOMs.
      required:
      - impact_summary
      - sboms
      - packages
      properties:
        impact_summary:
          $ref: '#/components/schemas/RecommendReportImpactSummary'
          description: High-level impact summary.
        packages:
          type: array
          items:
            $ref: '#/components/schemas/RecommendReportPackage'
          description: Deduplicated list of packages with vendor recommendations.
        sboms:
          type: array
          items:
            $ref: '#/components/schemas/RecommendReportSbom'
          description: Per-SBOM breakdown.
    RecommendReportSbom:
      type: object
      description: Per-SBOM summary in a recommendation report.
      required:
      - id
      - name
      - addressable_packages
      - vulnerability_count
      properties:
        addressable_packages:
          type: integer
          description: Number of packages in this SBOM that have a vendor recommendation.
          minimum: 0
        id:
          type: string
          format: uuid
          description: SBOM identifier.
        name:
          type: string
          description: SBOM document name.
        vulnerability_count:
          type: integer
          description: Number of distinct vulnerabilities across addressable packages in this SBOM.
          minimum: 0
    RecommendRequest:
      type: object
      required:
      - purls
      properties:
        purls:
          type: array
          items:
            $ref: '#/components/schemas/Purl'
    RecommendResponse:
      type: object
      required:
      - recommendations
      properties:
        recommendations:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/RecommendEntry'
          propertyNames:
            type: string
    RefreshFailure:
      type: object
      required:
      - sbom_id
      - error
      properties:
        error:
          type: string
        sbom_id:
          type: string
          format: uuid
    RefreshJob:
      type: object
      required:
      - id
      - revision
      - status
      - processed
      - failed
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        failed:
          type: integer
          format: int64
          minimum: 0
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: string
          format: uuid
        processed:
          type: integer
          format: int64
          description: Successfully processed documents. Failures are counted separately.
          minimum: 0
        revision:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/RefreshJobStatus'
    RefreshJobDetails:
      type: object
      required:
      - job
      - failures
      - failure_total
      properties:
        failure_total:
          type: integer
          format: int64
          minimum: 0
        failures:
          type: array
          items:
            $ref: '#/components/schemas/RefreshFailure'
        job:
          $ref: '#/components/schemas/RefreshJob'
    RefreshJobStatus:
      type: string
      enum:
      - queued
      - running
      - completed
      - superseded
    Relationship:
      type: string
      enum:
      - contains
      - dependency
      - dev_dependency
      - optional_dependency
      - provided_dependency
      - test_dependency
      - runtime_dependency
      - example
      - generates
      - ancestor_of
      - variant
      - build_tool
      - dev_tool
      - describes
      - package
      - undefined
    RemediationCategory:
      type: string
      description: The kind of a remediation, as CSAF defines them (OSV's fixed versions are vendor fixes).
      enum:
      - vendor_fix
      - workaround
      - mitigation
      - no_fix_planned
      - none_available
      - will_not_fix
    RemediationImportItem:
      type: object
      description: One entry in a remediation import payload (CSV row or JSON array element).
      required:
      - algorithm_name
      - replacement_name
      properties:
        algorithm_name:
          type: string
        algorithm_primitive:
          type:
          - string
          - 'null'
        replacement_name:
          type: string
        replacement_primitive:
          type:
          - string
          - 'null'
        replacement_standard:
          type:
          - string
          - 'null'
    RemediationImportResult:
      type: object
      description: Result returned after a remediation import operation.
      required:
      - count
      properties:
        count:
          type: integer
          description: Number of mappings processed (inserted or updated).
          minimum: 0
    RemediationMapping:
      type: object
      description: A single algorithm-to-NIST-replacement remediation mapping.
      required:
      - id
      - algorithm_name
      - algorithm_primitive
      - replacement_name
      - replacement_standard
      - replacement_primitive
      properties:
        algorithm_name:
          type: string
        algorithm_primitive:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        replacement_name:
          type: string
        replacement_primitive:
          type:
          - string
          - 'null'
        replacement_standard:
          type:
          - string
          - 'null'
    RemediationSummary:
      type: object
      required:
      - category
      - data
      properties:
        category:
          $ref: '#/components/schemas/RemediationCategory'
        data:
          description: For internal use only. May be removed at any point and should not be used.
          deprecated: true
        details:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
    Report:
      type: object
      required:
      - startDate
      - endDate
      properties:
        endDate:
          type: string
          format: date-time
          description: End of the import run
        messages:
          type: object
          description: Messages emitted during processing
          additionalProperties:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/Message'
            propertyNames:
              type: string
          propertyNames:
            type: string
            description: The phase of processing
            enum:
            - retrieval
            - validation
            - upload
        numberOfItems:
          type: integer
          description: Number of processes items
          minimum: 0
        startDate:
          type: string
          format: date-time
          description: Start of the import run
    RequestedField_HashMap_HashMap:
      oneOf:
      - type: 'null'
      - type: object
        additionalProperties:
          type: integer
          format: int64
          minimum: 0
        propertyNames:
          type: string
          description: |-
            Severity level for affected vulnerabilities, extending the shared `Severity`
            enum with an `Unknown` variant for vulnerabilities that have no CVSS score.
          enum:
          - unknown
          - none
          - low
          - medium
          - high
          - critical
    RequestedField_Vec_Vec_ScoredVector:
      oneOf:
      - type: 'null'
      - type: array
        items:
          allOf:
          - $ref: '#/components/schemas/Score'
            description: The score type, value, and derived severity.
          - type: object
            required:
            - vector
            properties:
              vector:
                type: string
                description: The raw CVSS vector string (e.g. `CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H`).
          description: |-
            A CVSS score combined with its raw vector string, for contexts where clients need both
            the pre-parsed numeric values and the original vector for display or re-parsing.
          example:
            type: '3.1'
            value: 7.5
            severity: high
            vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    RequestedField_i64_i64:
      oneOf:
      - type: 'null'
      - type: integer
        format: int64
    ResolutionEvidence:
      type: object
      required:
      - evidence_ref
      - advisory_id
      - status
      - match_confidence
      - assertion_origin
      - provider
      - provider_relationship
      - outcome
      - selection_reason
      properties:
        advisory_id:
          type: string
          format: uuid
        assertion_origin:
          $ref: '#/components/schemas/AssertionOrigin'
        confidence_factors:
          type: array
          items:
            $ref: '#/components/schemas/ConfidenceFactor'
          description: |-
            The factors of the match confidence, empty for evidence extracted before they were
            recorded.
        contexts:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceContext'
          description: |-
            The products (assertion contexts) the statement was matched in, and how the component got
            into them.
        evidence_ref:
          type: string
        match_confidence:
          type: number
          format: double
        outcome:
          $ref: '#/components/schemas/EvidenceOutcome'
        provider:
          $ref: '#/components/schemas/ProviderResolution'
        provider_relationship:
          $ref: '#/components/schemas/ProviderRelationship'
        remediations:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceRemediation'
          description: The remediations the advisory states for the statement.
        selection_reason:
          $ref: '#/components/schemas/SelectionReason'
        status:
          $ref: '#/components/schemas/AssertionStatus'
    ResolutionExplanation:
      type: object
      required:
      - status
      - component_provider
      - resolution_revision
      - evidence
      - deciding_criterion
      - reason
      properties:
        component_provider:
          $ref: '#/components/schemas/ProviderResolution'
        deciding_criterion:
          $ref: '#/components/schemas/SelectionReason'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/ResolutionEvidence'
          description: Ordered by eligibility, then the fixed resolution precedence.
        opposing_evidence:
          type:
          - string
          - 'null'
        reason:
          type: string
        resolution_revision:
          type: string
          format: uuid
          description: Fingerprint of resolver version, aliases, and resolution context.
        status:
          $ref: '#/components/schemas/VerdictStatus'
        winning_evidence:
          type:
          - string
          - 'null'
    ResolutionRequest:
      type: object
      description: Optional resolution context, shared by ordinary reads and temporary previews.
      properties:
        component_provider:
          type:
          - string
          - 'null'
          description: Temporary installed-build provider; does not change stored supplier metadata.
        include_explanation:
          type: boolean
          description: When true, include an explanation of how each verdict was resolved.
        node_id:
          type:
          - string
          - 'null'
          description: Only the verdicts of this SBOM node. Requires an SBOM target.
        product_context:
          type: array
          items:
            $ref: '#/components/schemas/IdentifierRef'
          description: |-
            Identifiers of the product containing the component, e.g. its CPE, used to match
            product-scoped advisory statements. Only supported for identifier targets.
        vulnerability_id:
          type:
          - string
          - 'null'
          description: Only the verdicts for this vulnerability, e.g. `CVE-2024-1234`.
      additionalProperties: false
    ResolutionSummary:
      type: object
      required:
      - confidence
      - has_conflict
      properties:
        confidence:
          type: number
          format: double
          description: Original match confidence of the selected evidence; conflicts do not reduce it.
        explanation:
          oneOf:
          - $ref: '#/components/schemas/ResolutionExplanation'
          - type: 'null'
        has_conflict:
          type: boolean
    Revisioned_Importer:
      type: object
      description: |-
        A struct wrapping an item with a revision.

        If the revision should not be part of the payload, but e.g. an HTTP header (like `ETag`), this
        struct can help carrying both pieces.
      required:
      - value
      - revision
      properties:
        revision:
          type: string
          description: |-
            The revision.

            An opaque string that should have no meaning to the user, only to the backend.
        value:
          allOf:
          - $ref: '#/components/schemas/ImporterData'
          - type: object
            required:
            - name
            properties:
              name:
                type: string
    SbomAdvisory:
      allOf:
      - $ref: '#/components/schemas/AdvisoryHead'
      - type: object
        required:
        - status
        properties:
          status:
            type: array
            items:
              $ref: '#/components/schemas/SbomStatus'
    SbomHead:
      type: object
      required:
      - id
      - labels
      - data_licenses
      - published
      - authors
      - suppliers
      - name
      - number_of_packages
      properties:
        authors:
          type: array
          items:
            type: string
          description: Authors of the SBOM
        data_licenses:
          type: array
          items:
            type: string
        document_id:
          type:
          - string
          - 'null'
        id:
          type: string
        labels:
          $ref: '#/components/schemas/Labels'
        name:
          type: string
        number_of_packages:
          type: integer
          format: int64
          description: The number of packages this SBOM has
          minimum: 0
        published:
          type:
          - string
          - 'null'
          format: date-time
        suppliers:
          type: array
          items:
            type: string
          description: Suppliers of the SBOMs content
    SbomImporter:
      allOf:
      - $ref: '#/components/schemas/CommonImporter'
      - type: object
        required:
        - source
        properties:
          fetchRetries:
            type:
            - integer
            - 'null'
            minimum: 0
          ignoreMissing:
            type: boolean
          keys:
            type: array
            items:
              type: string
              format: uri
          onlyPatterns:
            type: array
            items:
              type: string
          sizeLimit:
            oneOf:
            - $ref: '#/components/schemas/BinaryByteSize'
            - type: 'null'
          source:
            type: string
          v3Signatures:
            type: boolean
    SbomModel:
      type: object
      required:
      - id
      - name
      - purls
      - properties
      - sbom_count
      properties:
        id:
          type: string
          description: The internal ID of a model
        name:
          type: string
          description: The name of the model in the SBOM
        properties:
          type: object
          description: The properties associated with the model
          additionalProperties: {}
          propertyNames:
            type: string
        purls:
          type: array
          items:
            $ref: '#/components/schemas/PurlSummary'
          description: The model's PURL
        sbom_count:
          $ref: '#/components/schemas/RequestedField_i64_i64'
          description: Number of SBOMs containing this model
    SbomPackage:
      type: object
      required:
      - id
      - name
      - purl
      - cpe
      - licenses
      - licenses_ref_mapping
      properties:
        cpe:
          type: array
          items:
            type: string
          description: CPEs identifying the package
        group:
          type:
          - string
          - 'null'
          description: An optional group/namespace for an SBOM package
        id:
          type: string
          description: The SBOM internal ID of a package
        licenses:
          type: array
          items:
            $ref: '#/components/schemas/LicenseInfo'
          description: License info
        licenses_ref_mapping:
          type: array
          items:
            $ref: '#/components/schemas/LicenseRefMapping'
          description: |-
            LicenseRef mappings

            **Deprecated**: Licenses are now pre-expanded at ingestion time via `expanded_license` /
            `sbom_license_expanded` tables. This field is always empty and will be removed in a future
            release.
          deprecated: true
        name:
          type: string
          description: The name of the package in the SBOM
        purl:
          type: array
          items:
            $ref: '#/components/schemas/PurlSummary'
          description: PURLs identifying the package
        version:
          type:
          - string
          - 'null'
          description: An optional version for an SBOM package
    SbomPackageSummary:
      type: object
      required:
      - id
      - name
      properties:
        group:
          type:
          - string
          - 'null'
          description: An optional group/namespace for an SBOM package
        id:
          type: string
          description: The SBOM internal ID of a package
        name:
          type: string
          description: The name of the package in the SBOM
        version:
          type:
          - string
          - 'null'
          description: An optional version for an SBOM package
    SbomStatus:
      allOf:
      - $ref: '#/components/schemas/VulnerabilityHead'
      - type: object
        required:
        - status
        - packages
        - scores
        - fixed_versions
        properties:
          context:
            oneOf:
            - $ref: '#/components/schemas/StatusContext'
            - type: 'null'
          fixed_versions:
            type: array
            items:
              type: string
            description: Versions that fix this vulnerability, extracted from "fixed" advisory entries
          packages:
            type: array
            items:
              $ref: '#/components/schemas/SbomPackage'
          scores:
            type: array
            items:
              $ref: '#/components/schemas/ScoredVector'
          status:
            type: string
    SbomSummary:
      allOf:
      - $ref: '#/components/schemas/SbomHead'
      - $ref: '#/components/schemas/SourceDocument'
      - type: object
        required:
        - described_by
        properties:
          advisories:
            $ref: '#/components/schemas/RequestedField_HashMap_HashMap'
          described_by:
            type: array
            items:
              $ref: '#/components/schemas/SbomPackage'
    SbomVerdictCounts:
      type: object
      description: The number of verdicts, per (component, vulnerability), of an SBOM by status.
      required:
      - sbom_id
      - affected
      - fixed
      - not_affected
      - under_investigation
      - none
      properties:
        affected:
          type: integer
          format: int64
          minimum: 0
        fixed:
          type: integer
          format: int64
          minimum: 0
        freshness:
          $ref: '#/components/schemas/ExtractionFreshness'
        none:
          type: integer
          format: int64
          minimum: 0
        not_affected:
          type: integer
          format: int64
          minimum: 0
        remediations:
          type: integer
          format: int64
          description: |-
            The number of remediations the advisories state for the evidence, each once per component,
            vulnerability and advisory.
          minimum: 0
        sbom_id:
          type: string
          format: uuid
        under_investigation:
          type: integer
          format: int64
          minimum: 0
    Score:
      type: object
      description: 'A parsed CVSS score: the scoring system version, numeric value, and derived severity.'
      required:
      - type
      - value
      - severity
      properties:
        severity:
          $ref: '#/components/schemas/Severity'
          description: The severity band derived from the score value.
        type:
          $ref: '#/components/schemas/ScoreType'
          description: The scoring system version.
        value:
          type: number
          format: double
          description: The numeric score, rounded to one decimal place.
      example:
        type: '3.1'
        value: 7.5
        severity: high
    ScoreType:
      type: string
      description: The type of score, indicating the scoring system and version used.
      enum:
      - '2.0'
      - '3.0'
      - '3.1'
      - '4.0'
      x-enum-descriptions:
      - CVSS v2.0 score
      - CVSS v3.0 score
      - CVSS v3.1 score
      - CVSS v4.0 score
    ScoredVector:
      allOf:
      - $ref: '#/components/schemas/Score'
        description: The score type, value, and derived severity.
      - type: object
        required:
        - vector
        properties:
          vector:
            type: string
            description: The raw CVSS vector string (e.g. `CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H`).
      description: |-
        A CVSS score combined with its raw vector string, for contexts where clients need both
        the pre-parsed numeric values and the original vector for display or re-parsing.
      example:
        type: '3.1'
        value: 7.5
        severity: high
        vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    SelectionReason:
      type: string
      description: First criterion that distinguishes the selected statement from another statement.
      enum:
      - no_eligible_evidence
      - only_eligible_evidence
      - provider_relationship
      - assertion_origin
      - match_confidence
      - status_priority
      - evidence_reference
      - non_voting
    Severity:
      type: string
      description: Severity rating derived from a CVSS score value.
      enum:
      - none
      - low
      - medium
      - high
      - critical
      x-enum-descriptions:
      - No impact (score = 0.0)
      - Low severity (score 0.1–3.9)
      - Medium severity (score 4.0–6.9)
      - High severity (score 7.0–8.9)
      - Critical severity (score 9.0–10.0)
    SourceDocument:
      type: object
      required:
      - sha256
      - sha384
      - sha512
      - size
      - ingested
      properties:
        ingested:
          type: string
          format: date-time
          description: The timestamp the document was ingested
        sha256:
          type: string
        sha384:
          type: string
        sha512:
          type: string
        size:
          type: integer
          format: int64
          minimum: 0
    SpdxLicenseDetails:
      allOf:
      - $ref: '#/components/schemas/SpdxLicenseSummary'
      - type: object
        required:
        - text
        properties:
          text:
            type: string
    SpdxLicenseSummary:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
    State:
      type: string
      enum:
      - waiting
      - running
    StatementSubject:
      oneOf:
      - type: object
        description: A package, by its PURL without a version, e.g. `pkg:rpm/redhat/bind`.
        required:
        - purl
        - kind
        properties:
          kind:
            type: string
            enum:
            - purl
          purl:
            type: string
      - type: object
        description: A CPE, as CPE 2.3 formatted string.
        required:
        - cpe
        - kind
        properties:
          cpe:
            type: string
          kind:
            type: string
            enum:
            - cpe
      - type: object
        description: A product, optionally narrowed to a package of it.
        required:
        - name
        - kind
        properties:
          cpe_key:
            type:
            - string
            - 'null'
            description: The CPE key of the product version, if any.
          csaf_product_ids:
            type: array
            items:
              type: string
            description: The CSAF product IDs the statement originates from.
          kind:
            type: string
            enum:
            - product
          name:
            type: string
          package:
            type:
            - string
            - 'null'
            description: The package of the product the statement is about, if any.
      description: What an advisory statement is about.
    StatusContext:
      oneOf:
      - type: object
        required:
        - purl
        properties:
          purl:
            $ref: '#/components/schemas/Purl'
      - type: object
        required:
        - cpe
        properties:
          cpe:
            type: string
    StreamRelation:
      type: string
      description: How the release stream of an RPM relates to the one of a statement.
      enum:
      - exact
      - major
      - minor
    Update:
      type: object
      description: |
        An update set for labels.

        This is a key/value set, where the value can be a string for setting that value, or `null` for removing the label.
      additionalProperties:
        oneOf:
        - type: 'null'
        - type: string
    ValidationOutcome:
      type: string
      description: Whether a validator considered the document acceptable.
      enum:
      - passed
      - failed
    ValidationReport:
      type: object
      description: A structured report produced by a single validator run.
      required:
      - validator
      - outcome
      properties:
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
          description: Findings produced by the validator.
        outcome:
          $ref: '#/components/schemas/ValidationOutcome'
          description: The overall outcome, derived from the findings and the validator's threshold.
        validator:
          type: string
          description: The [`Validator::name`] that produced this report.
    ValidationSeverity:
      type: string
      description: Severity of a single validation finding.
      enum:
      - info
      - warning
      - error
      - fatal
    VerdictCountsRequest:
      type: object
      description: Request for the verdict counts of several SBOMs.
      required:
      - sbom_ids
      properties:
        sbom_ids:
          type: array
          items:
            type: string
            format: uuid
          description: The SBOMs to summarize.
    VerdictStatus:
      type: string
      description: Resolved verdict status.
      enum:
      - affected
      - fixed
      - not_affected
      - under_investigation
      - none
    VerdictSummary:
      allOf:
      - $ref: '#/components/schemas/ResolutionSummary'
      - type: object
        required:
        - component
        - vulnerability
        - status
        - evidence
        properties:
          component:
            $ref: '#/components/schemas/ComponentRef'
          component_provider:
            $ref: '#/components/schemas/ProviderResolution'
            description: The provider who supplied the component, as resolved through provider aliases.
          evidence:
            type: array
            items:
              $ref: '#/components/schemas/EvidenceDetail'
          status:
            $ref: '#/components/schemas/VerdictStatus'
          vulnerability:
            $ref: '#/components/schemas/VulnerabilityRef'
      description: Resolved determination per (component, vulnerability) pair.
    VersionRange:
      oneOf:
      - type: object
        required:
        - version_scheme_id
        - low_version
        - low_inclusive
        - high_version
        - high_inclusive
        properties:
          high_inclusive:
            type: boolean
          high_version:
            type: string
          low_inclusive:
            type: boolean
          low_version:
            type: string
          version_scheme_id:
            type: string
      - type: object
        required:
        - version_scheme_id
        - low_version
        - low_inclusive
        properties:
          low_inclusive:
            type: boolean
          low_version:
            type: string
          version_scheme_id:
            type: string
      - type: object
        required:
        - version_scheme_id
        - high_version
        - high_inclusive
        properties:
          high_inclusive:
            type: boolean
          high_version:
            type: string
          version_scheme_id:
            type: string
      - type: 'null'
        default: null
    VersionedPurlHead:
      type: object
      required:
      - uuid
      - purl
      - version
      properties:
        purl:
          $ref: '#/components/schemas/Purl'
          description: The actual, versioned PURL
        uuid:
          type: string
          format: uuid
          description: The ID of the versioned PURL
        version:
          type: string
          description: The version from the PURL
    VersionedPurlSummary:
      allOf:
      - $ref: '#/components/schemas/VersionedPurlHead'
      - type: object
        required:
        - base
        - purls
        properties:
          base:
            $ref: '#/components/schemas/BasePurlHead'
          purls:
            type: array
            items:
              $ref: '#/components/schemas/PurlHead'
    VexJustification:
      oneOf:
      - type: string
        enum:
        - ComponentNotPresent
      - type: string
        enum:
        - VulnerableCodeNotPresent
      - type: string
        enum:
        - VulnerableCodeNotInExecutePath
      - type: string
        enum:
        - VulnerableCodeCannotBeControlledByAdversary
      - type: string
        enum:
        - InlineMitigationsAlreadyExist
      - type: string
        enum:
        - NotProvided
      - type: object
        required:
        - Other
        properties:
          Other:
            type: string
    VexStatus:
      oneOf:
      - type: string
        enum:
        - Affected
      - type: string
        enum:
        - Fixed
      - type: string
        enum:
        - NotAffected
      - type: string
        enum:
        - UnderInvestigation
      - type: string
        enum:
        - Recommended
      - type: object
        required:
        - Other
        properties:
          Other:
            type: string
    VulnerabilityAdvisoryHead:
      allOf:
      - $ref: '#/components/schemas/AdvisoryHead'
      - type: object
        required:
        - scores
        properties:
          scores:
            type: array
            items:
              $ref: '#/components/schemas/ScoredVector'
            description: All CVSS scores with their raw vector strings from the advisory for this vulnerability.
    VulnerabilityAdvisoryStatus:
      type: object
      required:
      - base_purl
      - version
      - context
      properties:
        base_purl:
          $ref: '#/components/schemas/BasePurlHead'
        context:
          oneOf:
          - $ref: '#/components/schemas/StatusContext'
          - type: 'null'
        version:
          type: string
    VulnerabilityAdvisorySummary:
      allOf:
      - $ref: '#/components/schemas/VulnerabilityAdvisoryHead'
      - type: object
        required:
        - purls
        - sboms
        - number_of_vulnerabilities
        properties:
          number_of_vulnerabilities:
            type: integer
            format: int64
            description: The total number of vulnerabilities described by this advisory
            minimum: 0
          purls:
            type: object
            description: |-
              The statuses of PURLs, by status.

              Deprecated: use the correlation engine, `GET /v3/correlation/advisory/{id}/statement` for
              what the advisory states, `GET /v3/correlation/sbom/{id}` for the verdicts of an SBOM.
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/VulnerabilityAdvisoryStatus'
            propertyNames:
              type: string
            deprecated: true
          sboms:
            type: array
            items:
              $ref: '#/components/schemas/VulnerabilitySbomStatus'
            description: |-
              SBOMs claimed by this advisory to be addressed by this vulnerability.

              Deprecated: use the correlation engine, `GET /v3/correlation/sbom/{id}`.
            deprecated: true
    VulnerabilityDetails:
      allOf:
      - $ref: '#/components/schemas/VulnerabilityHead'
      - type: object
        required:
        - advisories
        - exploits
        properties:
          advisories:
            type: array
            items:
              $ref: '#/components/schemas/VulnerabilityAdvisorySummary'
            description: Advisories addressing this vulnerability, if any.
          exploits:
            type: array
            items:
              $ref: '#/components/schemas/Exploit'
            description: |-
              Reports that this vulnerability is exploited, or that working exploit
              code for it exists (e.g. from the CISA KEV catalog), if any.
          scores:
            $ref: '#/components/schemas/RequestedField_Vec_Vec_ScoredVector'
            description: |-
              Full CVSS scores from the authoritative advisory (the one that contributed the base_score).
              Only present when the `scores` query parameter is set to `true`.
    VulnerabilityHead:
      type: object
      required:
      - normative
      - identifier
      - title
      - description
      - reserved
      - published
      - modified
      - withdrawn
      - discovered
      - released
      - cwes
      properties:
        base_score:
          oneOf:
          - $ref: '#/components/schemas/BaseScore'
            description: The main, base score.
          - type: 'null'
        cwes:
          type: array
          items:
            type: string
          description: Associated CWE, if any.
        description:
          type:
          - string
          - 'null'
          description: The description of the vulnerability, if known.
        discovered:
          type:
          - string
          - 'null'
          format: date-time
          description: The date (in RFC3339 format) of when the vulnerability was discovered, if any.
        identifier:
          type: string
          description: |-
            The globally-unique identifier for the vulnerability.
            Traditionally (but not required) refers to the assigned
            CVE identifier.
        modified:
          type:
          - string
          - 'null'
          format: date-time
          description: The date (in RFC3339 format) of when the vulnerability was last modified, if any.
        normative:
          type: boolean
        published:
          type:
          - string
          - 'null'
          format: date-time
          description: The date (in RFC3339 format) of when the vulnerability was published, if any.
        released:
          type:
          - string
          - 'null'
          format: date-time
          description: The date (in RFC3339 format) of when software containing the vulnerability first released, if known.
        reserved:
          type:
          - string
          - 'null'
          format: date-time
          description: The date (in RFC3339 format) of when the vulnerability identifier was reserved, if any.
        title:
          type:
          - string
          - 'null'
          description: The title of the vulnerability, if known.
        withdrawn:
          type:
          - string
          - 'null'
          format: date-time
          description: The date (in RFC3339 format) of when the vulnerability was last withdrawn, if any.
    VulnerabilityRef:
      type: object
      description: Reference to an advisory's vulnerability assertion.
      required:
      - id
      - advisory_id
      - advisory_identifier
      properties:
        advisory_id:
          type: string
          format: uuid
        advisory_identifier:
          type: string
        advisory_type:
          type:
          - string
          - 'null'
          description: The format of the advisory (its `type` label), e.g. `csaf`, `cve` or `osv`.
        id:
          type: string
        title:
          type:
          - string
          - 'null'
        upstream:
          type: array
          items:
            type: string
          description: |-
            The upstream vulnerabilities the advisories of the evidence refer to for this one, e.g. the
            CVEs of a distribution's OSV record. They are different vulnerabilities, not aliases.
    VulnerabilitySbomStatus:
      allOf:
      - $ref: '#/components/schemas/SbomHead'
      - type: object
        required:
        - purl_statuses
        properties:
          purl_statuses:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/PurlSummary'
              uniqueItems: true
            propertyNames:
              type: string
          version:
            type:
            - string
            - 'null'
    VulnerabilityStatus:
      type: object
      required:
      - id
      - remediations
      properties:
        id:
          type: string
        justification:
          oneOf:
          - $ref: '#/components/schemas/VexJustification'
          - type: 'null'
        remediations:
          type: array
          items:
            $ref: '#/components/schemas/RemediationSummary'
        status:
          oneOf:
          - $ref: '#/components/schemas/VexStatus'
          - type: 'null'
    VulnerabilitySummary:
      allOf:
      - $ref: '#/components/schemas/VulnerabilityHead'
